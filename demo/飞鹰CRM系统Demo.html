    draw();
  });

  /* ============================================================ 商机看板 */
  F.register("opportunities", function () {
    var st = { view: "board", owner: "", kw: "" };
    var STAGES = ["初步接触", "需求确认", "方案报价", "商务谈判", "赢单", "输单"];

    function draw() {
      F.api("GET", "/api/opportunities?" + F.qs({ owner: st.owner, kw: st.kw, pageSize: 200 }))
        .then(function (d) {
          var head = '<div class="panel"><div class="panel-title">商机看板' +
            '<span class="panel-actions">' +
            '<input id="oKw" type="text" placeholder="商机 / 客户 / 编号" value="' + F.esc(st.kw) + '" style="width:180px">' +
            '<select id="oOwner"><option value="">全部负责人</option>' +
            ["liuyang", "wangfang", "zhangwei"].map(function (o) {
              return '<option value="' + o + '"' + (st.owner === o ? " selected" : "") + ">" + o + "</option>";
            }).join("") + "</select>" +
            '<button class="btn sm" id="oSearch">查询</button>' +
            '<button class="btn sm' + (st.view === "board" ? " primary" : "") + '" id="vBoard">看板</button>' +
            '<button class="btn sm' + (st.view === "list" ? " primary" : "") + '" id="vList">列表</button>' +
            "</span></div>" +
            '<div class="panel-body"><div class="funnel-mini">' +
            d.funnel.stages.map(function (s) {
              return '<div class="fm"><div class="fm-v">' + F.wan(s.amount) + "</div>" +
                '<div class="fm-l">' + F.esc(s.stage) + " · " + s.count + "</div></div>";
            }).join("") + "</div></div></div>";

          var body;
          if (st.view === "board") {
            body = '<div class="board">' + STAGES.map(function (sg) {
              var items = (d.list || []).filter(function (o) { return o.stage === sg; });
              var sum = items.reduce(function (a, o) { return a + o.amount; }, 0);
              return '<div class="col"><div class="col-hd">' + F.esc(sg) +
                '<span>' + items.length + " · " + F.wan(sum) + "</span></div>" +
                items.map(function (o) {
                  return '<div class="card" data-opp="' + F.esc(o.no) + '">' +
                    '<div class="card-t">' + F.esc(o.name) + "</div>" +
                    '<div class="card-c">' + F.esc(o.customerName) + "</div>" +
                    '<div class="card-m"><b>' + F.wan(o.amount) + "</b>" +
                    '<span>' + F.pct(o.probability, 0) + " · " + F.wan(o.weighted) + "</span></div>" +
                    '<div class="card-f">' + F.esc(o.ownerName || "") +
                    (o.overdue ? ' <span class="tag red">延期</span>' : "") +
                    ' <span class="muted">' + F.esc((o.expectCloseDate || "").slice(5)) + "</span></div></div>";
                }).join("") + "</div>";
            }).join("") + "</div>";
          } else {
            body = '<div class="panel"><div class="panel-body flush">' + F.table([
              { label: "编号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "商机", render: function (r) { return F.esc(r.name) + '<div class="muted small">' +
                F.esc(r.customerName) + "</div>"; } },
              { label: "阶段", render: function (r) { return F.tag(r.stage); } },
              { label: "金额", num: true, render: function (r) { return F.wan(r.amount); } },
              { label: "概率", num: true, render: function (r) { return F.pct(r.probability, 0); } },
              { label: "加权", num: true, render: function (r) { return F.wan(r.weighted); } },
              { label: "预计结单", render: function (r) {
                return (r.overdue ? '<b class="up">' : "") + F.esc(r.expectCloseDate) + (r.overdue ? "</b>" : ""); } },
              { label: "负责人", render: function (r) { return F.esc(r.ownerName); } },
              { label: "状态", render: function (r) { return F.tag(r.status); } }
            ], d.list, { click: function (r) { return r.no; }, empty: "暂无商机" }) + "</div></div>";
          }
          document.getElementById("view").innerHTML = head + body;
          document.getElementById("oSearch").addEventListener("click", function () {
            st.kw = document.getElementById("oKw").value.trim();
            st.owner = document.getElementById("oOwner").value;
            draw();
          });
          document.getElementById("vBoard").addEventListener("click", function () { st.view = "board"; draw(); });
          document.getElementById("vList").addEventListener("click", function () { st.view = "list"; draw(); });
          document.querySelectorAll("[data-opp]").forEach(function (el) {
            el.addEventListener("click", function () { openOpp(el.getAttribute("data-opp")); });
          });
          F.bindRows(document, openOpp);
          F.setStatus("商机 · 在谈 " + d.funnel.openCount + " 个 / 全额 " + F.wan(d.funnel.openAmount) +
            " · 赢单率 " + F.pct(d.funnel.winRate, 1));
          F.setSide('<div class="side-block"><div class="hd">漏斗（含转化）</div><div class="bd">' +
            d.funnel.stages.map(function (s) {
              return '<div class="side-kv"><span>' + F.esc(s.stage) + " · " + s.count + " 个</span><b>" +
                F.wan(s.amount) + "</b></div>";
            }).join("") + "</div></div>" +
            '<div class="side-block"><div class="hd">结单情况</div><div class="bd">' +
            '<div class="side-kv"><span>赢单</span><b class="down">' + d.funnel.wonCount + " / " +
            F.wan(d.funnel.wonAmount) + "</b></div>" +
            '<div class="side-kv"><span>输单</span><b class="up">' + d.funnel.lostCount + " / " +
            F.wan(d.funnel.lostAmount) + "</b></div>" +
            '<div class="side-kv"><span>平均客单</span><b>' + F.wan(d.funnel.avgDeal) + "</b></div>" +
            "</div></div>");
        });
    }

    function openOpp(no) {
      F.api("GET", "/api/opportunities/" + encodeURIComponent(no)).then(function (d) {
        var canAct = ["admin", "sales_director", "sales"].indexOf(me().role) >= 0;
        var logs = (d.stageLogs || []).map(function (l) {
          return '<div class="tl-item"><span class="tl-time">' + F.esc(l.created_at) + "</span>" +
            F.esc(l.from_stage || "创建") + " → <b>" + F.esc(l.to_stage) + "</b>" +
            '<span class="small muted"> · ' + F.esc(l.operator) + " " + F.esc(l.remark || "") + "</span></div>";
        }).join("");
        var acts = (d.activities || []).slice(0, 8).map(function (a) {
          return '<div class="tl-item"><span class="tl-time">' + F.esc(a.happenAt) + "</span>" +
            F.tag(a.kind, "blue") + " " + F.esc(a.subject) +
            '<div class="small muted">' + F.esc(a.content) + "</div></div>";
        }).join("");
        var html = '<div class="detail-head"><div><div class="dh-title">' + F.esc(d.name) + "</div>" +
          '<div class="muted small">' + F.esc(d.no) + " · " + F.esc(d.customerName) + " · " +
          F.esc(d.ownerName) + "</div></div><div class='dh-tags'>" + F.tag(d.stage) +
          (d.overdue ? F.tag("已延期", "red") : "") + "</div></div>" +
          '<div class="kpi-grid four" style="margin:10px 0">' +
          '<div class="kpi"><div class="k-label">金额</div><div class="k-value">' + F.wan(d.amount) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">赢率 / 加权</div><div class="k-value" style="font-size:17px">' +
          F.pct(d.probability, 0) + " · " + F.wan(d.weighted) + "</div></div>" +
          '<div class="kpi"><div class="k-label">预计结单</div><div class="k-value" style="font-size:17px">' +
          F.esc(d.expectCloseDate || "—") + "</div></div>" +
          '<div class="kpi green"><div class="k-label">距结单</div><div class="k-value" style="font-size:17px">' +
          (d.daysToClose === null ? "—" : d.daysToClose + " 天") + "</div></div></div>" +
          '<div class="form-row small"><label>竞品</label>' + F.esc(d.competitor || "—") +
          '<label>决策人</label>' + F.esc(d.decisionMaker || "—") +
          '<label>来源</label>' + F.esc(d.source || "—") + "</div>" +
          '<div class="section-title">阶段闸口</div><div class="gate">' +
          ["需求确认", "方案报价", "商务谈判", "赢单"].map(function (s) {
            var miss = (d.stageGate || {})[s] || [];
            return '<div class="gate-row"><b>' + F.esc(s) + "</b>" +
              (miss.length ? '<span class="tag red">缺 ' + F.esc(miss.join("、")) + "</span>"
                : '<span class="tag green">可进入</span>') + "</div>";
          }).join("") + "</div>" +
          '<div class="section-title">推进阶段</div>' +
          (canAct ? '<div class="form-row" id="stageBtns">' + (d.canAdvance || []).map(function (s) {
            return '<button class="btn sm" data-stage="' + F.esc(s) + '">→ ' + F.esc(s) + "</button>";
          }).join("") + '<button class="btn sm danger" id="oLose">标记输单</button></div>'
            : '<div class="small muted">当前角色可查看，不能推进阶段</div>') +
          '<div class="section-title">阶段轨迹</div><div class="timeline">' + (logs || F.empty("暂无")) + "</div>" +
          '<div class="section-title">最近跟进</div><div class="timeline">' + (acts || F.empty("暂无跟进")) + "</div>";
        F.dialog("商机 " + d.no, html,
          '<button class="btn" data-close7="1">关闭</button>' +
          '<button class="btn" id="oFollow">写跟进</button>');
        document.querySelector("[data-close7]").addEventListener("click", F.closeDialog);
        document.getElementById("oFollow").addEventListener("click", function () {
          F.closeDialog(); F.followDialog("opportunity", d.no, draw);
        });
        document.querySelectorAll("[data-stage]").forEach(function (b) {
          b.addEventListener("click", function () {
            var target = b.getAttribute("data-stage");
            var payload = { stage: target };
            if (target === "商务谈判") {
              var comp = window.prompt("竞品情况（进入商务谈判必填）", d.competitor || "销售易");
              if (comp === null) return;
              payload.competitor = comp;
              var dm = window.prompt("决策人（必填）", d.decisionMaker || "");
              if (dm === null) return;
              payload.decisionMaker = dm;
            }
            if (target === "赢单") {
              var reason = window.prompt("赢单要点（写入轨迹）", "价格与服务优于竞品");
              if (reason === null) return;
              payload.reason = reason;
            }
            F.api("POST", "/api/opportunities/" + d.no + "/stage", payload).then(function () {
              F.closeDialog();
              F.toast("已推进到「" + target + "」", "ok");
              draw(); F.reload();
            }).catch(function (e) {
              F.toast(e.message, "err");
            });
          });
        });
        var lose = document.getElementById("oLose");
        if (lose) lose.addEventListener("click", function () {
          var reason = window.prompt("输单原因（必填）", "预算被削减，选择自研");
          if (!reason) return;
          F.api("POST", "/api/opportunities/" + d.no + "/close", { result: "lose", reason: reason })
            .then(function () { F.closeDialog(); F.toast("已标记输单", "ok"); draw(); F.reload(); })
            .catch(function (e) { F.toast(e.message, "err"); });
        });
      });
    }

    draw();
  });

  /* ============================================================ 跟进记录 */
  F.register("activities", function () {
    var st = { kind: "全部" };
    function draw() {
      F.api("GET", "/api/activities?" + F.qs({ kind: st.kind })).then(function (d) {
        var chips = ["全部", "电话", "拜访", "邮件", "会议", "微信"].map(function (k) {
          return '<button class="chip ' + (st.kind === k ? "on" : "") + '" data-k="' + k + '">' + k +
            "<b>" + (k === "全部" ? d.total : (d.byKind[k] || 0)) + "</b></button>";
        }).join("");
        var html = '<div class="panel"><div class="panel-title">跟进记录' +
          '<span class="panel-actions"><button class="btn sm primary" id="aNew">+ 新建跟进</button></span></div>' +
          '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
          '<div class="panel-body flush">' +
          F.table([
            { label: "时间", render: function (r) { return '<span class="small muted">' + F.esc(r.happenAt) + "</span>"; } },
            { label: "对象", render: function (r) {
              return F.tag(r.objType === "lead" ? "线索" : (r.objType === "opportunity" ? "商机" :
                (r.objType === "ticket" ? "工单" : "客户")), "gray") + " " + F.esc(r.objName);
            } },
            { label: "方式", render: function (r) { return F.tag(r.kind, "blue"); } },
            { label: "主题", key: "subject" },
            { label: "内容", render: function (r) { return '<span class="small">' +
              F.esc((r.content || "").slice(0, 40)) + (r.content && r.content.length > 40 ? "…" : "") + "</span>"; } },
            { label: "时长", num: true, render: function (r) { return r.durationMin + " 分"; } },
            { label: "结果", render: function (r) { return F.esc(r.result || "—"); } },
            { label: "负责人", render: function (r) { return F.esc(r.ownerName); } }
          ], d.list, { empty: "暂无跟进记录" }) + "</div></div>";
        document.getElementById("view").innerHTML = html;
        document.getElementById("aNew").addEventListener("click", function () {
          F.api("GET", "/api/customers?pageSize=200").then(function (cs) {
            F.followDialog("customer", (cs.list[0] || {}).code || "", draw, cs.list);
          });
        });
        document.querySelectorAll("[data-k]").forEach(function (b) {
          b.addEventListener("click", function () { st.kind = b.getAttribute("data-k"); draw(); });
        });
        F.setStatus("跟进记录 · " + d.total + " 条");
        F.setSide('<div class="side-block"><div class="hd">跟进方式分布</div><div class="bd">' +
          Object.keys(d.byKind).map(function (k) {
            return '<div class="side-kv"><span>' + k + "</span><b>" + d.byKind[k] + "</b></div>";
          }).join("") + "</div></div>" +
          '<div class="side-block"><div class="hd">小提示</div><div class="bd small muted" style="line-height:1.9">' +
          "跟进会回写客户的最近联系时间，直接影响客户健康分与公海回收判断。</div></div>");
      });
    }
    draw();
  });

  /* ============================================================ 通用跟进弹层 */
  F.followDialog = function (objType, objNo, done, custList) {
    F.api("GET", "/api/customers?pageSize=200").then(function (cs) {
      var opts = (custList || cs.list || []).map(function (c) {
        return '<option value="' + F.esc(c.code) + '"' + (c.code === objNo ? " selected" : "") + ">" +
          F.esc(c.name) + "</option>";
      }).join("");
      var body = '<div class="form-grid">' +
        '<label>关联类型</label><select id="fType">' +
        ["customer", "lead", "opportunity", "ticket"].map(function (t) {
          return '<option value="' + t + '"' + (t === objType ? " selected" : "") + ">" + t + "</option>";
        }).join("") + "</select>" +
        '<label>关联客户</label><select id="fCust">' + opts + "</select>" +
        '<label>方式</label><select id="fKind">' + ["电话", "拜访", "邮件", "会议", "微信", "任务"]
          .map(function (k) { return "<option>" + k + "</option>"; }).join("") + "</select>" +
        '<label>时长（分钟）</label><input id="fDur" type="number" value="30">' +
        '<label>时间</label><input id="fWhen" type="datetime-local" value="' +
        new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) + '">' +
        "</div>" +
        '<div class="form-row" style="margin-top:8px"><label>主题 *</label></div>' +
        '<input id="fSub" type="text" style="width:100%" value="需求沟通">' +
        '<div class="form-row" style="margin-top:8px"><label>内容</label></div>' +
        '<textarea id="fCon" rows="3" style="width:100%" placeholder="客户反馈、关键结论、下一步"></textarea>' +
        '<div class="form-row" style="margin-top:8px"><label>下一步计划</label>' +
        '<input id="fNext" type="text" style="flex:1" placeholder="如 下周三发送正式报价"></div>';
      F.dialog("写跟进", body, '<button class="btn" data-close8="1">取消</button>' +
        '<button class="btn primary" id="fSave">保存</button>');
      document.querySelector("[data-close8]").addEventListener("click", F.closeDialog);
      document.getElementById("fSave").addEventListener("click", function () {
        var target = objNo;
        if (document.getElementById("fType").value !== objType) target = objNo;
        var when = document.getElementById("fWhen").value;
        F.api("POST", "/api/activities", {
          objType: objType, objNo: target,
          kind: document.getElementById("fKind").value,
          subject: document.getElementById("fSub").value.trim() || "需求沟通",
          content: document.getElementById("fCon").value.trim(),
          happenAt: when ? when.replace("T", " ") + ":00" : undefined,
          durationMin: Number(document.getElementById("fDur").value || 30),
          nextPlan: document.getElementById("fNext").value.trim()
        }).then(function () {
          F.closeDialog(); F.toast("跟进已记录", "ok");
          if (done) done();
          F.reload();
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    });
  };
})(window, document);

</script>
<script>
/* 飞鹰 CRM · 报价、合同、回款 */
(function (window, document) {
  "use strict";
  var F = window.F;

  function me() { return (F.state.boot && F.state.boot.user) || {}; }
  function canApprove() {
    var r = me().role;
    return r === "admin" || r === "sales_director";
  }

  function customerOptions(cb) {
    F.api("GET", "/api/customers?pageSize=300").then(function (d) {
      cb((d.list || []).map(function (c) {
        return '<option value="' + F.esc(c.code) + '">' + F.esc(c.name) + "</option>";
      }).join(""));
    });
  }

  /* ============================================================ 报价 */
  F.register("quotes", function () {
    var st = { status: "全部", kw: "" };

    function draw() {
      F.api("GET", "/api/quotes?" + F.qs({ status: st.status, kw: st.kw, pageSize: 200 }))
        .then(function (d) {
          var stats = d.stats || {};
          var chips = ["全部", "草稿", "待审批", "已批准", "已发送", "已接受", "已驳回"].map(function (s) {
            return '<button class="chip ' + (st.status === s ? "on" : "") + '" data-st="' + s + '">' +
              s + "<b>" + (s === "全部" ? d.total : (stats[s] || 0)) + "</b></button>";
          }).join("");
          var html = '<div class="panel"><div class="panel-title">报价管理' +
            '<span class="panel-actions">' +
            '<input id="qKw" type="text" placeholder="编号 / 客户 / 标题" value="' + F.esc(st.kw) + '" style="width:180px">' +
            '<button class="btn sm" id="qSearch">查询</button>' +
            '<button class="btn sm primary" id="qNew">+ 新建报价</button></span></div>' +
            '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
            '<div class="panel-body flush">' +
            F.table([
              { label: "编号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "客户 / 标题", render: function (r) { return F.esc(r.customerName) +
                '<div class="muted small">' + F.esc(r.title) + "</div>"; } },
              { label: "标准额", num: true, render: function (r) { return F.wan(r.listAmount); } },
              { label: "报价额", num: true, render: function (r) { return F.wan(r.amount); } },
              { label: "折扣", num: true, render: function (r) {
                return r.discountPct > 0 ? '<b class="' + (r.discountPct > 15 ? "up" : "") + '">' +
                  r.discountPct.toFixed(1) + "%</b>" : "—"; } },
              { label: "状态", render: function (r) { return F.tag(r.status); } },
              { label: "有效期", key: "validUntil" },
              { label: "负责人", render: function (r) { return F.esc(r.ownerName); } }
            ], d.list, { click: function (r) { return r.no; }, empty: "暂无报价单" }) + "</div></div>";
          document.getElementById("view").innerHTML = html;
          document.getElementById("qSearch").addEventListener("click", function () {
            st.kw = document.getElementById("qKw").value.trim(); draw();
          });
          document.getElementById("qNew").addEventListener("click", newQuote);
          document.querySelectorAll("[data-st]").forEach(function (b) {
            b.addEventListener("click", function () { st.status = b.getAttribute("data-st"); draw(); });
          });
          F.bindRows(document, openQuote);
          F.setStatus("报价管理 · " + d.total + " 张（待审批 " + (stats["待审批"] || 0) + "）");
          F.setSide('<div class="side-block"><div class="hd">折扣审批线</div><div class="bd small muted" style="line-height:1.9">' +
            "折扣率 = 1 − 报价额 / 标准价。<br>超过规则阈值（默认 15%）自动进入「待审批」，销售总监批准后才能发送给客户。<br>" +
            "低于阈值可直接发送。</div></div>");
        });
    }

    function newQuote() {
      customerOptions(function (opts) {
        (function () {
          var body = '<div class="form-grid">' +
            '<label>客户 *</label><select id="qCust">' + opts + "</select>" +
            '<label>报价标题</label><input id="qTitle" type="text" value="CRM 系统报价单">' +
            '<label>有效期至</label><input id="qValid" type="date" value="' + F.addDays(30) + '">' +
            '<label>备注</label><input id="qRemark" type="text" placeholder="如 含 1 年运维">' +
            "</div>" +
            '<div class="section-title">报价明细</div>' +
            '<div id="qLines"></div>' +
            '<button class="btn sm" id="qAdd">+ 添加一行</button>' +
            '<div class="calc-box" id="qCalc"></div>';
          F.dialog("新建报价", body, '<button class="btn" data-close9="1">取消</button>' +
            '<button class="btn primary" id="qSave">保存</button>');
          document.querySelector("[data-close9]").addEventListener("click", F.closeDialog);
          var products = [];
          F.api("GET", "/api/products").then(function (r) {
            products = r.list;
            addLine(); addLine();
          }).catch(function () {
            products = [{ code: "P-CRM-PRO", name: "飞鹰 CRM 专业版", price: 158000 },
              { code: "P-IMP", name: "实施服务包", price: 2400 }];
            addLine(); addLine();
          });

          function addLine() {
            var i = document.querySelectorAll("#qLines .qline").length;
            var div = document.createElement("div");
            div.className = "qline form-row";
            div.innerHTML = '<select class="lnProd">' + (products.length ? products.map(function (p) {
              return '<option value="' + F.esc(p.code) + '" data-price="' + p.price + '">' +
                F.esc(p.name) + "（标准价 " + F.num(p.price, 0) + "）</option>";
            }).join("") : '<option value="P-CRM-PRO" data-price="158000">飞鹰 CRM 专业版</option>') + "</select>" +
              '<input class="lnQty" type="number" value="1" style="width:80px" title="数量">' +
              '<input class="lnPrice" type="number" style="width:130px" title="成交单价">' +
              '<button class="btn sm" data-del="1">删除</button>';
            document.getElementById("qLines").appendChild(div);
            var sel = div.querySelector(".lnProd");
            var price = div.querySelector(".lnPrice");
            function sync() {
              var p = sel.options[sel.selectedIndex];
              price.value = p ? p.getAttribute("data-price") : 0;
              calc();
            }
            sel.addEventListener("change", sync);
            div.querySelector(".lnQty").addEventListener("input", calc);
            price.addEventListener("input", calc);
            div.querySelector("[data-del]").addEventListener("click", function () {
              if (document.querySelectorAll("#qLines .qline").length > 1) { div.remove(); calc(); }
            });
            sync();
          }

          function calc() {
            var list = 0, amt = 0;
            document.querySelectorAll("#qLines .qline").forEach(function (ln) {
              var sel = ln.querySelector(".lnProd");
              var p = sel.options[sel.selectedIndex];
              var lp = p ? Number(p.getAttribute("data-price")) : 0;
              var q = Number(ln.querySelector(".lnQty").value || 0);
              var pr = Number(ln.querySelector(".lnPrice").value || 0);
              list += lp * q; amt += pr * q;
            });
            var rate = list ? (1 - amt / list) : 0;
            var box = document.getElementById("qCalc");
            if (!box) return;
            box.innerHTML = "标准额 <b>" + F.money(list) + "</b> ｜ 报价额 <b>" + F.money(amt) +
              "</b> ｜ 折扣 <b class='" + (rate > 0.15 ? "up" : "") + "'>" + (rate * 100).toFixed(1) +
              "%</b>" + (rate > 0.15 ? ' <span class="tag gold">超审批线，保存后需总监批准</span>' : "");
          }

          document.getElementById("qAdd").addEventListener("click", addLine);
          document.getElementById("qSave").addEventListener("click", function () {
            var lines = [];
            document.querySelectorAll("#qLines .qline").forEach(function (ln) {
              var sel = ln.querySelector(".lnProd");
              lines.push({ productCode: sel.value, qty: Number(ln.querySelector(".lnQty").value || 0),
                price: Number(ln.querySelector(".lnPrice").value || 0) });
            });
            F.api("POST", "/api/quotes", {
              customerCode: document.getElementById("qCust").value,
              title: document.getElementById("qTitle").value.trim(),
              validUntil: document.getElementById("qValid").value,
              remark: document.getElementById("qRemark").value.trim(), lines: lines
            }).then(function (r) {
              F.closeDialog();
              F.toast("报价已创建：" + r.no + "（" + r.status + "，折扣 " + r.discountPct.toFixed(1) + "%）", "ok");
              draw();
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        })();
      });
    }

    function openQuote(no) {
      F.api("GET", "/api/quotes/" + encodeURIComponent(no)).then(function (d) {
        var lines = F.table([
          { label: "序", render: function (r) { return r.seq; } },
          { label: "产品", render: function (r) { return F.esc(r.product_name) + ' <span class="muted small mono">' +
            F.esc(r.product_code) + "</span>"; } },
          { label: "数量", num: true, render: function (r) { return F.num(r.qty, 0); } },
          { label: "标准价", num: true, render: function (r) { return F.money(r.list_price); } },
          { label: "成交价", num: true, render: function (r) { return F.money(r.price); } },
          { label: "金额", num: true, render: function (r) { return F.money(r.amount); } }
        ], d.lines || []);
        var html = '<div class="detail-head"><div><div class="dh-title">' + F.esc(d.title) + "</div>" +
          '<div class="muted small">' + F.esc(d.no) + " · " + F.esc(d.customerName) +
          (d.oppNo ? " · " + F.esc(d.oppNo) : "") + "</div></div>" +
          '<div class="dh-tags">' + F.tag(d.status) + "</div></div>" +
          '<div class="kpi-grid four" style="margin:10px 0">' +
          '<div class="kpi"><div class="k-label">标准额</div><div class="k-value" style="font-size:17px">' +
          F.money(d.listAmount) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">报价额</div><div class="k-value" style="font-size:17px">' +
          F.money(d.amount) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">折扣率</div><div class="k-value" style="font-size:17px">' +
          d.discountPct.toFixed(1) + "%</div><div class='k-sub'>审批线 " +
          (d.threshold * 100).toFixed(0) + "%</div></div>" +
          '<div class="kpi"><div class="k-label">有效期</div><div class="k-value" style="font-size:17px">' +
          F.esc(d.validUntil) + "</div></div></div>" + lines +
          (d.rejectReason ? '<div class="warn-box">驳回原因：' + F.esc(d.rejectReason) + "</div>" : "") +
          '<div class="small muted" style="margin-top:8px">负责人 ' + F.esc(d.ownerName) +
          (d.approverName ? " · 审批人 " + F.esc(d.approverName) : "") + "</div>";
        var foot = '<button class="btn" data-close10="1">关闭</button>';
        if (d.status === "待审批" && canApprove()) {
          foot += '<button class="btn danger" id="qReject">驳回</button>' +
            '<button class="btn primary" id="qApprove">批准</button>';
        }
        if (d.status === "草稿" || d.status === "已批准") foot += '<button class="btn primary" id="qSend">发送给客户</button>';
        if (d.status === "已发送") foot += '<button class="btn primary" id="qAccept">客户已接受</button>';
        F.dialog("报价 " + d.no, html, foot);
        document.querySelector("[data-close10]").addEventListener("click", F.closeDialog);
        function post(path, payload, ok) {
          F.api("POST", path, payload || {}).then(function () {
            F.closeDialog(); F.toast(ok, "ok"); draw(); F.reload();
          }).catch(function (e) { F.toast(e.message, "err"); });
        }
        var a = document.getElementById("qApprove");
        if (a) a.addEventListener("click", function () { post("/api/quotes/" + d.no + "/approve", {}, "已批准"); });
        var rj = document.getElementById("qReject");
        if (rj) rj.addEventListener("click", function () {
          var reason = window.prompt("驳回原因（必填）", "折扣过低，需再谈");
          if (!reason) return;
          post("/api/quotes/" + d.no + "/reject", { reason: reason }, "已驳回");
        });
        var sd = document.getElementById("qSend");
        if (sd) sd.addEventListener("click", function () { post("/api/quotes/" + d.no + "/send", {}, "已发送"); });
        var ac = document.getElementById("qAccept");
        if (ac) ac.addEventListener("click", function () { post("/api/quotes/" + d.no + "/accept", {}, "已标记客户接受"); });
      });
    }

    draw();
  });

  /* ============================================================ 合同 */
  F.register("contracts", function () {
    var st = { status: "全部", kw: "" };

    function draw() {
      F.api("GET", "/api/contracts?" + F.qs({ status: st.status, kw: st.kw, pageSize: 200 }))
        .then(function (d) {
          var stats = d.stats || {};
          var chips = ["全部", "待签署", "已签署", "执行中", "已完成", "已终止"].map(function (s) {
            return '<button class="chip ' + (st.status === s ? "on" : "") + '" data-st="' + s + '">' +
              s + "<b>" + (s === "全部" ? d.total : (stats[s] || 0)) + "</b></button>";
          }).join("");
          var html = '<div class="panel"><div class="panel-title">合同管理' +
            '<span class="panel-actions">' +
            '<input id="tKw" type="text" placeholder="编号 / 客户 / 标题" value="' + F.esc(st.kw) + '" style="width:180px">' +
            '<button class="btn sm" id="tSearch">查询</button>' +
            '<button class="btn sm primary" id="tNew">+ 新建合同</button></span></div>' +
            '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
            '<div class="panel-body flush">' +
            F.table([
              { label: "合同号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "客户 / 标题", render: function (r) { return F.esc(r.customerName) +
                '<div class="muted small">' + F.esc(r.title) + "</div>"; } },
              { label: "金额", num: true, render: function (r) { return F.wan(r.amount); } },
              { label: "已收", num: true, render: function (r) { return F.wan(r.paidAmount); } },
              { label: "逾期", num: true, render: function (r) {
                return r.overdueAmount > 0 ? '<b class="up">' + F.wan(r.overdueAmount) + "</b>" : "—"; } },
              { label: "回款进度", render: function (r) {
                return '<span class="progress"><i style="width:' + Math.round(r.progress * 100) + '%"></i></span> ' +
                  F.pct(r.progress, 0); } },
              { label: "签署日", key: "signDate" },
              { label: "状态", render: function (r) { return F.tag(r.status); } },
              { label: "负责人", render: function (r) { return F.esc(r.ownerName); } }
            ], d.list, { click: function (r) { return r.no; }, empty: "暂无合同" }) + "</div></div>";
          document.getElementById("view").innerHTML = html;
          document.getElementById("tSearch").addEventListener("click", function () {
            st.kw = document.getElementById("tKw").value.trim(); draw();
          });
          document.getElementById("tNew").addEventListener("click", newContract);
          document.querySelectorAll("[data-st]").forEach(function (b) {
            b.addEventListener("click", function () { st.status = b.getAttribute("data-st"); draw(); });
          });
          F.bindRows(document, openContract);
          var total = (d.list || []).reduce(function (a, r) { return a + r.amount; }, 0);
          var paid = (d.list || []).reduce(function (a, r) { return a + r.paidAmount; }, 0);
          F.setStatus("合同管理 · " + d.total + " 份 · 合同额 " + F.wan(total) + " · 已收 " + F.wan(paid));
          F.setSide('<div class="side-block"><div class="hd">合同概况</div><div class="bd">' +
            '<div class="side-kv"><span>合同总额</span><b>' + F.wan(total) + "</b></div>" +
            '<div class="side-kv"><span>已回款</span><b class="down">' + F.wan(paid) + "</b></div>" +
            '<div class="side-kv"><span>回款率</span><b>' +
            (total ? F.pct(paid / total, 1) : "—") + "</b></div>" +
            '<div class="side-kv"><span>待签署</span><b>' + (stats["待签署"] || 0) + "</b></div>" +
            "</div></div>");
        });
    }

    function newContract() {
      customerOptions(function (opts) {
        var body = '<div class="form-grid">' +
          '<label>客户 *</label><select id="tCust">' + opts + "</select>" +
          '<label>合同标题</label><input id="tTitle" type="text" value="CRM 年度服务合同">' +
          '<label>合同金额 *</label><input id="tAmount" type="number" value="238000">' +
          '<label>签署日期</label><input id="tSign" type="date" value="' + F.today() + '">' +
          '<label>付款条件</label><select id="tTerms"><option value="3-4-3">3-4-3（签约 30/60/90 天）</option>' +
          '<option value="5-5">5-5（两期）</option><option value="10">一次性付清</option></select>' +
          '<label>关联商机</label><input id="tOpp" type="text" placeholder="选填，如 OPP20261020-0001">' +
          "</div>" +
          '<div class="small muted" style="margin-top:8px">保存后按付款条件自动生成回款计划，签署后商机自动推进为赢单。</div>';
        F.dialog("新建合同", body, '<button class="btn" data-close11="1">取消</button>' +
          '<button class="btn primary" id="tSave">保存</button>');
        document.querySelector("[data-close11]").addEventListener("click", F.closeDialog);
        document.getElementById("tSave").addEventListener("click", function () {
          F.api("POST", "/api/contracts", {
            customerCode: document.getElementById("tCust").value,
            title: document.getElementById("tTitle").value.trim(),
            amount: Number(document.getElementById("tAmount").value || 0),
            signDate: document.getElementById("tSign").value,
            paymentTerms: document.getElementById("tTerms").value,
            oppNo: document.getElementById("tOpp").value.trim()
          }).then(function (r) {
            F.closeDialog(); F.toast("合同已创建：" + r.no + "（待签署）", "ok");
            draw(); F.reload();
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
    }

    function openContract(no) {
      F.api("GET", "/api/contracts/" + encodeURIComponent(no)).then(function (d) {
        var plans = F.table([
          { label: "期次", render: function (r) { return "第 " + r.seq + " 期"; } },
          { label: "应收日期", key: "due_date" },
          { label: "应收", num: true, render: function (r) { return F.money(r.amount); } },
          { label: "已收", num: true, render: function (r) { return F.money(r.paidAmount); } },
          { label: "未收", num: true, render: function (r) { return F.money(r.leftAmount); } },
          { label: "状态", render: function (r) { return F.tag(r.status); } },
          { label: "逾期", num: true, render: function (r) {
            return r.overdueDays ? '<b class="up">' + r.overdueDays + " 天</b>" : "—"; } }
        ], d.plans || [], { empty: "无回款计划" });
        var pays = F.table([
          { label: "收款单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
          { label: "日期", key: "pay_date" },
          { label: "金额", num: true, render: function (r) { return F.money(r.amount); } },
          { label: "方式", key: "method" },
          { label: "经办", key: "operator" }
        ], d.payments || [], { empty: "暂无收款记录" });
        var html = '<div class="detail-head"><div><div class="dh-title">' + F.esc(d.title) + "</div>" +
          '<div class="muted small">' + F.esc(d.no) + " · " + F.esc(d.customerName) + " · 付款条件 " +
          F.esc(d.paymentTerms) + "</div></div><div class='dh-tags'>" + F.tag(d.status) + "</div></div>" +
          '<div class="kpi-grid five" style="margin:10px 0">' +
          '<div class="kpi"><div class="k-label">合同金额</div><div class="k-value" style="font-size:16px">' +
          F.wan(d.amount) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">已回款</div><div class="k-value" style="font-size:16px">' +
          F.wan(d.paidAmount) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">未收</div><div class="k-value" style="font-size:16px">' +
          F.wan(d.unpaidAmount) + "</div></div>" +
          '<div class="kpi red"><div class="k-label">逾期</div><div class="k-value" style="font-size:16px">' +
          F.wan(d.overdueAmount) + "</div></div>" +
          '<div class="kpi"><div class="k-label">回款进度</div><div class="k-value" style="font-size:16px">' +
          F.pct(d.progress, 0) + "</div></div></div>" +
          '<div class="section-title">回款计划</div>' + plans +
          '<div class="section-title">收款记录</div>' + pays;
        var foot = '<button class="btn" data-close12="1">关闭</button>';
        if (d.status === "待签署") foot += '<button class="btn primary" id="ctSign">签署合同</button>';
        if (d.status !== "已完成" && d.status !== "已终止") {
          foot += '<button class="btn" id="ctPay">登记收款</button>';
        }
        if (canApprove() && d.status !== "已完成" && d.status !== "已终止") {
          foot += '<button class="btn danger" id="ctTerm">终止</button>';
        }
        F.dialog("合同 " + d.no, html, foot);
        document.querySelector("[data-close12]").addEventListener("click", F.closeDialog);
        var sg = document.getElementById("ctSign");
        if (sg) sg.addEventListener("click", function () {
          F.api("POST", "/api/contracts/" + d.no + "/sign", { signDate: F.today() })
            .then(function () {
              F.closeDialog(); F.toast("合同已签署，回款计划已按签署日重排", "ok");
              draw(); F.reload();
            }).catch(function (e) { F.toast(e.message, "err"); });
        });
        var py = document.getElementById("ctPay");
        if (py) py.addEventListener("click", function () {
          F.closeDialog(); payDialog(d.no, draw);
        });
        var tm = document.getElementById("ctTerm");
        if (tm) tm.addEventListener("click", function () {
          var reason = window.prompt("终止原因（必填）", "客户项目终止");
          if (!reason) return;
          F.api("POST", "/api/contracts/" + d.no + "/terminate", { reason: reason })
            .then(function () { F.closeDialog(); F.toast("合同已终止", "ok"); draw(); F.reload(); })
            .catch(function (e) { F.toast(e.message, "err"); });
        });
      });
    }

    draw();
  });

  /* ============================================================ 回款 */
  function payDialog(contractNo, done) {
    F.api("GET", "/api/contracts?pageSize=300").then(function (cs) {
      var list = (cs.list || []).filter(function (c) {
        return c.status !== "已终止" && c.unpaidAmount > 0;
      });
      var opts = list.map(function (c) {
        return '<option value="' + F.esc(c.no) + '"' + (c.no === contractNo ? " selected" : "") + ">" +
          F.esc(c.customerName) + " · 未收 " + F.num(c.unpaidAmount, 2) + "</option>";
      }).join("");
      var body = '<div class="form-grid">' +
        '<label>合同 *</label><select id="pContract">' + opts + "</select>" +
        '<label>收款金额 *</label><input id="pAmount" type="number" value="' + (function () {
          var c = list.filter(function (x) { return x.no === contractNo; })[0] || list[0];
          return c ? Math.round(c.unpaidAmount) : 50000;
        })() + '">' +
        '<label>收款日期</label><input id="pDate" type="date" value="' + F.today() + '">' +
        '<label>方式</label><select id="pMethod"><option>银行转账</option><option>银行承兑</option>' +
        '<option>现金</option><option>支付宝/微信</option></select>' +
        '<label>备注</label><input id="pRemark" type="text" placeholder="如 第二期款">' +
        "</div>" +
        '<div class="small muted" style="margin-top:8px">不指定期次时按到期日先后自动核销（FIFO）。</div>';
      F.dialog("登记收款", body, '<button class="btn" data-close13="1">取消</button>' +
        '<button class="btn primary" id="pSave">保存</button>');
      document.querySelector("[data-close13]").addEventListener("click", F.closeDialog);
      document.getElementById("pSave").addEventListener("click", function () {
        F.api("POST", "/api/payments", {
          contractNo: document.getElementById("pContract").value,
          amount: Number(document.getElementById("pAmount").value || 0),
          payDate: document.getElementById("pDate").value,
          method: document.getElementById("pMethod").value,
          remark: document.getElementById("pRemark").value.trim()
        }).then(function (r) {
          F.closeDialog();
          F.toast("已登记收款 " + F.money(r.amount) + "，剩余未收 " + F.money(r.unpaidAmount), "ok");
          if (done) done();
          F.reload();
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    });
  }
  F.payDialog = payDialog;

  F.register("payments", function () {
    var st = { overdue: false, status: "全部" };

    function draw() {
      F.api("GET", "/api/payments/plans?" + F.qs({ overdue: st.overdue ? 1 : "", status: st.status, pageSize: 200 }))
        .then(function (d) {
          F.api("GET", "/api/payments?kw=").then(function (pay) {
            var aging = d.aging || {};
            var agingHtml = Object.keys(aging).map(function (k) {
              return '<div class="fm"><div class="fm-v">' + F.wan(aging[k]) + "</div>" +
                '<div class="fm-l">' + k + "</div></div>";
            }).join("");
            var html = '<div class="kpi-grid four">' +
              '<div class="kpi"><div class="k-label">未收合计</div><div class="k-value">' +
              F.wan(d.totalUnpaid) + "</div></div>" +
              '<div class="kpi red"><div class="k-label">逾期未收</div><div class="k-value">' +
              F.wan(d.totalOverdue) + "</div></div>" +
              '<div class="kpi green"><div class="k-label">本期已收</div><div class="k-value">' +
              F.wan(pay.totalAmount) + "</div></div>" +
              '<div class="kpi gold"><div class="k-label">收款笔数</div><div class="k-value">' +
              pay.total + "</div></div></div>" +
              '<div class="panel"><div class="panel-title">应收账龄</div><div class="panel-body">' +
              '<div class="funnel-mini">' + agingHtml + "</div></div></div>" +
              '<div class="panel"><div class="panel-title">回款计划' +
              '<span class="panel-actions">' +
              '<label class="small"><input type="checkbox" id="fOver"' + (st.overdue ? " checked" : "") +
              '> 只看逾期</label>' +
              '<button class="btn sm primary" id="pNew">+ 登记收款</button></span></div>' +
              '<div class="panel-body flush">' +
              F.table([
                { label: "合同", render: function (r) { return '<span class="mono small">' + F.esc(r.contractNo) + "</span>"; } },
                { label: "客户", key: "customerName" },
                { label: "期次", render: function (r) { return "第 " + r.seq + " 期"; } },
                { label: "应收日", key: "dueDate" },
                { label: "应收", num: true, render: function (r) { return F.money(r.amount); } },
                { label: "已收", num: true, render: function (r) { return F.money(r.paidAmount); } },
                { label: "未收", num: true, render: function (r) { return F.money(r.leftAmount); } },
                { label: "状态", render: function (r) { return F.tag(r.status); } },
                { label: "逾期", num: true, render: function (r) {
                  return r.overdueDays ? '<b class="up">' + r.overdueDays + " 天</b>" : "—"; } }
              ], d.list, { empty: "没有待收计划" }) + "</div></div>" +
              '<div class="panel"><div class="panel-title">收款流水</div><div class="panel-body flush">' +
              F.table([
                { label: "收款单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
                { label: "合同", render: function (r) { return '<span class="mono small">' + F.esc(r.contractNo) + "</span>"; } },
                { label: "客户", key: "customerName" },
                { label: "金额", num: true, render: function (r) { return F.money(r.amount); } },
                { label: "日期", key: "payDate" },
                { label: "方式", key: "method" },
                { label: "经办", key: "operator" }
              ], pay.list, { empty: "暂无收款" }) + "</div></div>";
            document.getElementById("view").innerHTML = html;
            document.getElementById("fOver").addEventListener("change", function (e) {
              st.overdue = e.target.checked; draw();
            });
            document.getElementById("pNew").addEventListener("click", function () {
              payDialog("", draw);
            });
            F.setStatus("回款管理 · 未收 " + F.wan(d.totalUnpaid) + " · 逾期 " + F.wan(d.totalOverdue));
            F.setSide('<div class="side-block"><div class="hd">账龄口径</div><div class="bd small muted" style="line-height:1.9">' +
              "按回款计划应收日与今天之差分档：未到期 / 1-30 / 31-60 / 61-90 / 90 天以上。<br>" +
              "收款按到期日先进先出核销，未收清零后期次自动转「已收」，全部收齐合同转「已完成」。</div></div>");
          });
        });
    }
    draw();
  });
})(window, document);

</script>
<script>
/* 飞鹰 CRM · 服务工单、市场活动、报表分析 */
(function (window, document) {
  "use strict";
  var F = window.F;

  function me() { return (F.state.boot && F.state.boot.user) || {}; }

  /* ============================================================ 服务工单 */
  F.register("tickets", function () {
    var st = { status: "全部", priority: "全部", kw: "", overdue: false };

    function draw() {
      F.api("GET", "/api/tickets?" + F.qs({ status: st.status, priority: st.priority, kw: st.kw,
        overdue: st.overdue ? 1 : "", pageSize: 200 })).then(function (d) {
        var s = d.stats || {};
        var sla = s.sla || {};
        var chips = ["全部", "待受理", "处理中", "待确认", "已解决", "已关闭"].map(function (k) {
          return '<button class="chip ' + (st.status === k ? "on" : "") + '" data-st="' + k + '">' + k +
            "<b>" + (k === "全部" ? d.total : ((s.status || {})[k] || 0)) + "</b></button>";
        }).join("");
        var html = '<div class="kpi-grid four">' +
          '<div class="kpi red"><div class="k-label">SLA 超时</div><div class="k-value">' +
          (sla["超时"] || 0) + "</div><div class='k-sub'>临期 " + (sla["临期"] || 0) + " 张</div></div>" +
          '<div class="kpi gold"><div class="k-label">待受理</div><div class="k-value">' +
          ((s.status || {})["待受理"] || 0) + "</div></div>" +
          '<div class="kpi"><div class="k-label">处理中</div><div class="k-value">' +
          ((s.status || {})["处理中"] || 0) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">平均满意度</div><div class="k-value">' +
          (d.avgSatisfaction ? d.avgSatisfaction.toFixed(1) : "—") + '<span class="small muted"> / 5</span></div></div>' +
          "</div>" +
          '<div class="panel"><div class="panel-title">服务工单' +
          '<span class="panel-actions">' +
          '<input id="tkKw" type="text" placeholder="工单号 / 标题 / 客户" value="' + F.esc(st.kw) + '" style="width:180px">' +
          '<select id="tkPri">' + ["全部", "P1", "P2", "P3"].map(function (p) {
            return '<option' + (p === st.priority ? " selected" : "") + ">" + p + "</option>";
          }).join("") + "</select>" +
          '<label class="small"><input type="checkbox" id="tkOver"' + (st.overdue ? " checked" : "") +
          "> 只看超时</label>" +
          '<button class="btn sm" id="tkSearch">查询</button>' +
          '<button class="btn sm primary" id="tkNew">+ 新建工单</button></span></div>' +
          '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
          '<div class="panel-body flush">' +
          F.table([
            { label: "工单号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "客户 / 标题", render: function (r) { return F.esc(r.customerName) +
              '<div class="muted small">' + F.esc(r.title) + "</div>"; } },
            { label: "类别", render: function (r) { return F.tag(r.category, "gray"); } },
            { label: "优先级", render: function (r) {
              return F.tag(r.priority, r.priority === "P1" ? "red" : (r.priority === "P2" ? "gold" : "gray")); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "SLA", render: function (r) { return F.slaTag(r.slaState); } },
            { label: "剩余", num: true, render: function (r) {
              if (r.slaState === "已完成") return "—";
              var h = r.slaLeftHours;
              return '<b class="' + (h < 0 ? "up" : (h < 2 ? "flat" : "")) + '">' +
                (h < 0 ? "超 " + Math.abs(h).toFixed(1) : h.toFixed(1)) + " h</b>";
            } },
            { label: "负责人", render: function (r) { return F.esc(r.ownerName || "—"); } },
            { label: "创建", render: function (r) { return '<span class="small muted">' +
              F.esc((r.createdAt || "").slice(5, 16)) + "</span>"; } }
          ], d.list, { click: function (r) { return r.no; }, empty: "暂无工单" }) + "</div></div>";
        document.getElementById("view").innerHTML = html;
        document.getElementById("tkSearch").addEventListener("click", function () {
          st.kw = document.getElementById("tkKw").value.trim();
          st.priority = document.getElementById("tkPri").value;
          st.overdue = document.getElementById("tkOver").checked;
          draw();
        });
        document.getElementById("tkNew").addEventListener("click", newTicket);
        document.querySelectorAll("[data-st]").forEach(function (b) {
          b.addEventListener("click", function () { st.status = b.getAttribute("data-st"); draw(); });
        });
        F.bindRows(document, openTicket);
        F.setStatus("服务工单 · " + d.total + " 张 · 超时 " + (sla["超时"] || 0) + " 张");
        F.setSide('<div class="side-block"><div class="hd">SLA 口径</div><div class="bd">' +
          '<div class="side-kv"><span>P1 系统不可用</span><b>4 小时</b></div>' +
          '<div class="side-kv"><span>P2 功能异常</span><b>8 小时</b></div>' +
          '<div class="side-kv"><span>P3 咨询/需求</span><b>24 小时</b></div>' +
          "</div></div>" +
          '<div class="side-block"><div class="hd">优先级分布</div><div class="bd">' +
          Object.keys(s.priority || {}).sort().map(function (k) {
            return '<div class="side-kv"><span>' + k + "</span><b>" + s.priority[k] + "</b></div>";
          }).join("") + "</div></div>");
      });
    }

    function newTicket() {
      F.api("GET", "/api/customers?pageSize=300").then(function (cs) {
        var opts = (cs.list || []).map(function (c) {
          return '<option value="' + F.esc(c.code) + '">' + F.esc(c.name) + "</option>";
        }).join("");
        var body = '<div class="form-grid">' +
          '<label>客户 *</label><select id="tkCust">' + opts + "</select>" +
          '<label>标题 *</label><input id="tkTitle" type="text" placeholder="如 客户数据导入报错">' +
          '<label>类别</label><select id="tkCat"><option>故障</option><option>咨询</option>' +
          "<option>投诉</option><option>需求</option></select>" +
          '<label>优先级</label><select id="tkP"><option>P3</option><option selected>P2</option>' +
          "<option>P1</option></select>" +
          "</div>" +
          '<div class="form-row" style="margin-top:8px"><label>问题描述</label></div>' +
          '<textarea id="tkDesc" rows="3" style="width:100%" placeholder="现象、影响范围、复现步骤"></textarea>' +
          '<div class="small muted" style="margin-top:8px">提交后按优先级自动计算 SLA 解决时限，超时会进入预警。</div>';
        F.dialog("新建工单", body, '<button class="btn" data-close14="1">取消</button>' +
          '<button class="btn primary" id="tkSave">提交</button>');
        document.querySelector("[data-close14]").addEventListener("click", F.closeDialog);
        document.getElementById("tkSave").addEventListener("click", function () {
          F.api("POST", "/api/tickets", {
            customerCode: document.getElementById("tkCust").value,
            title: document.getElementById("tkTitle").value.trim(),
            category: document.getElementById("tkCat").value,
            priority: document.getElementById("tkP").value,
            description: document.getElementById("tkDesc").value.trim()
          }).then(function (r) {
            F.closeDialog();
            F.toast("工单已创建：" + r.no + "，SLA 截止 " + r.resolveDue, "ok");
            draw(); F.reload();
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
    }

    function openTicket(no) {
      F.api("GET", "/api/tickets/" + encodeURIComponent(no)).then(function (d) {
        var logs = (d.logs || []).map(function (l) {
          return '<div class="tl-item"><span class="tl-time">' + F.esc(l.created_at) + "</span>" +
            F.tag(l.action, "blue") + ' <span>' + F.esc(l.content) + "</span>" +
            '<span class="small muted"> · ' + F.esc(l.operator) + "</span></div>";
        }).join("");
        var html = '<div class="detail-head"><div><div class="dh-title">' + F.esc(d.title) + "</div>" +
          '<div class="muted small">' + F.esc(d.no) + " · " + F.esc(d.customerName) + " · " +
          F.esc(d.category) + "</div></div><div class='dh-tags'>" + F.tag(d.status) +
          F.tag(d.priority, d.priority === "P1" ? "red" : "gold") + F.slaTag(d.slaState) + "</div></div>" +
          '<div class="kpi-grid four" style="margin:10px 0">' +
          '<div class="kpi"><div class="k-label">受理时限</div><div class="k-value" style="font-size:14px">' +
          F.esc(d.responseDue) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">解决时限</div><div class="k-value" style="font-size:14px">' +
          F.esc(d.resolveDue) + "</div></div>" +
          '<div class="kpi ' + (d.slaLeftHours < 0 ? "red" : "green") + '"><div class="k-label">剩余</div>' +
          '<div class="k-value" style="font-size:16px">' +
          (d.slaState === "已完成" ? "已完成" : d.slaLeftHours.toFixed(1) + " h") + "</div></div>" +
          '<div class="kpi"><div class="k-label">满意度</div><div class="k-value" style="font-size:16px">' +
          (d.satisfaction || "—") + "</div></div></div>" +
          '<div class="note">' + F.esc(d.description || "未填写描述") + "</div>" +
          (d.resolution ? '<div class="ok-box">处理结论：' + F.esc(d.resolution) + "</div>" : "") +
          '<div class="section-title">处理轨迹</div><div class="timeline">' + (logs || F.empty("暂无")) + "</div>";
        var foot = '<button class="btn" data-close15="1">关闭</button>' +
          '<button class="btn" id="tkComment">回复</button>';
        if (d.status === "待受理") foot += '<button class="btn primary" id="tkAccept">受理</button>';
        if (d.status === "处理中" || d.status === "待受理") {
          foot += '<button class="btn primary" id="tkResolve">解决</button>';
        }
        if (d.status === "已解决" || d.status === "待确认") {
          foot += '<button class="btn primary" id="tkClose">关闭并评价</button>';
        }
        F.dialog("工单 " + d.no, html, foot);
        document.querySelector("[data-close15]").addEventListener("click", F.closeDialog);
        function post(action, payload, ok) {
          F.api("POST", "/api/tickets/" + d.no + "/" + action, payload || {}).then(function () {
            F.closeDialog(); F.toast(ok, "ok"); draw(); F.reload();
          }).catch(function (e) { F.toast(e.message, "err"); });
        }
        var a = document.getElementById("tkAccept");
        if (a) a.addEventListener("click", function () { post("accept", { comment: "已受理" }, "已受理"); });
        var rs = document.getElementById("tkResolve");
        if (rs) rs.addEventListener("click", function () {
          var txt = window.prompt("处理结论（必填）", "已定位原因并修复，请客户验证");
          if (!txt) return;
          post("resolve", { resolution: txt }, "工单已解决");
        });
        var cl = document.getElementById("tkClose");
        if (cl) cl.addEventListener("click", function () {
          var sat = window.prompt("客户满意度（1-5）", "5");
          if (sat === null) return;
          post("close", { satisfaction: Number(sat) }, "工单已关闭");
        });
        document.getElementById("tkComment").addEventListener("click", function () {
          var txt = window.prompt("回复内容", "已收到，正在排查");
          if (!txt) return;
          post("comment", { content: txt }, "已回复");
        });
      });
    }

    draw();
  });

  /* ============================================================ 市场活动 */
  F.register("campaigns", function () {

      F.api("GET", "/api/campaigns").then(function (d) {
        var totalCost = (d.list || []).reduce(function (a, r) { return a + r.cost; }, 0);

          '<div class="kpi green"><div class="k-label">归因签约额</div><div class="k-value">' + F.wan(totalWon) + "</div></div>" +

          '<div class="panel"><div class="panel-title">市场活动与投入产出' +

          '<div class="panel-body flush">' +
          F.table([
            { label: "活动", render: function (r) { return F.esc(r.name) + '<div class="muted small mono">' +
              F.esc(r.code) + "</div>"; } },
            { label: "类型", render: function (r) { return F.tag(r.kind, "gray"); } },
            { label: "投放周期", render: function (r) { return '<span class="small">' + F.esc(r.startDate) +

            { label: "预算", num: true, render: function (r) { return F.wan(r.budget); } },
            { label: "实际投入", num: true, render: function (r) { return F.wan(r.cost); } },
            { label: "预算执行", render: function (r) {
              return '<span class="progress"><i style="width:' + Math.round(r.budgetUsage * 100) + '%"></i></span> ' +

            { label: "线索", num: true, render: function (r) { return r.leads; } },
            { label: "单线索成本", num: true, render: function (r) { return F.num(r.cpl, 0); } },
            { label: "归因签约", num: true, render: function (r) { return F.wan(r.wonAmount); } },
            { label: "ROI", num: true, render: function (r) {

          '<div class="panel"><div class="panel-title">投入产出对比</div><div class="panel-body">' +
          F.barChart((d.list || []).map(function (r) {
            return { label: r.code.replace("CP-2026-", ""), value: r.wonAmount,
              label2: F.wan(r.wonAmount), color: "#2b9eb3" };
          }), { height: 170 }) + "</div></div>";
        document.getElementById("view").innerHTML = html;
        document.getElementById("cpNew").addEventListener("click", function () {
          var body = '<div class="form-grid">' +
            '<label>活动名称 *</label><input id="cpName" type="text">' +
            '<label>类型</label><select id="cpKind"><option>线上投放</option><option>展会</option>' +
            "<option>内容营销</option><option>渠道合作</option><option>老客推荐</option></select>" +
            '<label>渠道</label><input id="cpChannel" type="text" value="微信公众号">' +
            '<label>预算</label><input id="cpBudget" type="number" value="50000">' +
            '<label>实际投入</label><input id="cpCost" type="number" value="0">' +
            '<label>目标线索</label><input id="cpTarget" type="number" value="60">' +
            "</div>";
          F.dialog("新建市场活动", body, '<button class="btn" data-close16="1">取消</button>' +
            '<button class="btn primary" id="cpSave">保存</button>');
          document.querySelector("[data-close16]").addEventListener("click", F.closeDialog);
          document.getElementById("cpSave").addEventListener("click", function () {
            F.api("POST", "/api/campaigns", {
              name: document.getElementById("cpName").value.trim(),
              kind: document.getElementById("cpKind").value,
              channel: document.getElementById("cpChannel").value.trim(),
              budget: Number(document.getElementById("cpBudget").value || 0),
              cost: Number(document.getElementById("cpCost").value || 0),

  /* ============================================================ 报表 */
  F.register("reports", function () {
    var cur = "funnel";
    var TABS = [["funnel", "销售漏斗"], ["performance", "业绩排行"], ["source", "来源转化"],

            '<div class="panel"><div class="panel-title">各阶段金额分布</div><div class="panel-body">' +
            F.barChart(f.stages.map(function (s) {
              return { label: s.stage, value: s.amount, label2: F.wan(s.amount), color: "#2b9eb3" };
            }), { height: 170 }) + "</div></div>" +
            '<div class="panel"><div class="panel-title">负责人漏斗' +
            '<span class="panel-actions small muted">赢率预警线 ' + F.pct(f.threshold || 0.35, 0) + "</span></div>" +
            '<div class="panel-body flush">' + F.table([
              { label: "负责人", key: "ownerName" },
              { label: "在谈数", num: true, key: "count" },
              { label: "在谈金额", num: true, render: function (r) { return F.wan(r.amount); } },
              { label: "平均单产", num: true, render: function (r) {
                return F.wan(r.count ? r.amount / r.count : 0); } }
            ], f.byOwner || []) + "</div></div>";
        } else if (cur === "performance") {
          var p = d.performance;
          body.innerHTML = '<div class="kpi-grid three">' +
            '<div class="kpi"><div class="k-label">账期</div><div class="k-value" style="font-size:18px">' +
            F.esc(p.period) + "</div></div>" +
            '<div class="kpi green"><div class="k-label">目标合计</div><div class="k-value">' + F.wan(p.totalTarget) + "</div></div>" +
            '<div class="kpi gold"><div class="k-label">签约合计</div><div class="k-value">' + F.wan(p.totalWon) + "</div></div></div>" +
            '<div class="panel"><div class="panel-title">业绩排行与目标达成</div><div class="panel-body flush">' +
            F.table([
              { label: "销售", key: "ownerName" },
              { label: "目标", num: true, render: function (r) { return F.wan(r.target); } },
              { label: "签约额", num: true, render: function (r) { return F.wan(r.wonAmount); } },
              { label: "达成率", render: function (r) {
                return '<span class="progress"><i style="width:' + Math.min(100, Math.round(r.rate * 100)) +
                  '%"></i></span> ' + F.pct(r.rate, 1); } },
              { label: "单数", num: true, key: "wonCount" },
              { label: "客单价", num: true, render: function (r) { return F.wan(r.avgDeal); } },
              { label: "在谈", num: true, render: function (r) { return r.openCount + " / " + F.wan(r.openAmount); } },
              { label: "加权", num: true, render: function (r) { return F.wan(r.weighted); } },
              { label: "回款", num: true, render: function (r) { return F.wan(r.paidAmount); } }
            ], p.list, { empty: "暂无数据" }) + "</div></div>" +
            '<div class="panel"><div class="panel-title">签约额对比</div><div class="panel-body">' +
            F.barChart(p.list.map(function (r) {
              return { label: r.ownerName.slice(0, 3), value: r.wonAmount, label2: F.wan(r.wonAmount),
                color: "#1e8449" };
            }), { height: 160 }) + "</div></div>";
        } else if (cur === "source") {
          var s = d.source;
          body.innerHTML = '<div class="panel"><div class="panel-title">线索来源转化</div><div class="panel-body flush">' +
            F.table([
              { label: "来源", render: function (r) { return F.tag(r.source, "gray"); } },
              { label: "线索数", num: true, key: "leads" },
              { label: "转客户", num: true, key: "converted" },
              { label: "转化率", render: function (r) {
                return '<span class="progress"><i style="width:' + Math.round(r.conversionRate * 100) +
                  '%"></i></span> ' + F.pct(r.conversionRate, 1); } },
              { label: "赢单数", num: true, key: "wonCount" },
              { label: "签约额", num: true, render: function (r) { return F.wan(r.wonAmount); } },
              { label: "平均客单", num: true, render: function (r) { return F.wan(r.avgDeal); } }
            ], s.list || []) + "</div></div>" +
            '<div class="panel"><div class="panel-title">各来源签约额</div><div class="panel-body">' +
            F.barChart((s.list || []).map(function (r) {
              return { label: r.source, value: r.wonAmount, label2: F.wan(r.wonAmount), color: "#c8963e" };
            }), { height: 170 }) + "</div></div>";
        } else if (cur === "forecast") {
          var fc = d.forecast;
          body.innerHTML = '<div class="kpi-grid three">' +
            '<div class="kpi"><div class="k-label">预测总额（全额）</div><div class="k-value">' +
            F.wan(fc.total.amount) + "</div></div>" +
            '<div class="kpi gold"><div class="k-label">加权预测</div><div class="k-value">' +
            F.wan(fc.total.weighted) + "</div></div>" +
            '<div class="kpi green"><div class="k-label">商机数</div><div class="k-value">' +
            fc.total.count + "</div></div></div>" +
            '<div class="panel"><div class="panel-title">滚动预测（加权 / 乐观 / 悲观）</div><div class="panel-body">' +
            F.lineChart([
