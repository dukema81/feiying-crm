<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞泉SCM系统 · 离线演示版</title>
<style>
:root {
  --bg: #0f1c26;
  --bar: #12262f;
  --bar2: #1a3540;
  --line: #d8dee4;
  --ink: #1f2d38;
  --muted: #6b7a88;
  --accent: #1f7a8c;
  --accent2: #2b9eb3;
  --gold: #c8963e;
  --up: #c0392b;
  --down: #1e8449;
  --warn: #b7791f;
  --bg-soft: #f4f7f9;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg-soft);
}

a { color: var(--accent); text-decoration: none; }
.spacer { flex: 1; }
.mono { font-family: Consolas, "Courier New", monospace; }
.small { font-size: 12px; }
.muted { color: var(--muted); }
.num { text-align: right; font-family: Consolas, monospace; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--muted); }

/* ---------------------------------------------------------------- 应用骨架 */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 1180px;
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 54px;
  padding: 0 14px;
  background: linear-gradient(180deg, #16323d, #10242c);
  color: #eaf2f5;
  border-bottom: 1px solid #0a171d;
}
.titlebar .brand { display: flex; align-items: center; gap: 10px; }
.titlebar .logo {
  width: 34px; height: 34px; line-height: 34px; text-align: center;
  background: linear-gradient(145deg, var(--accent2), var(--accent));
  border-radius: 8px; font-weight: 700; color: #fff; font-size: 17px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
}
.titlebar .co { font-size: 13px; font-weight: 600; letter-spacing: .5px; }
.titlebar .sys { font-size: 11px; color: #8fb0bd; margin-top: 2px; }
.titlebar .ver { font-size: 11px; color: #7f9dab; }
.titlebar .opuser { font-size: 12px; color: #cfe0e6; }
.titlebar .winbtns { display: flex; gap: 14px; margin-left: 12px; color: #9ab4bf; font-size: 12px; }
.titlebar .winbtns .close:hover { color: #ff8b7a; }

.menubar {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 36px;
  padding: 0 8px;
  background: var(--bar2);
  border-bottom: 1px solid #0d1e26;
}
.menubar button {
  background: transparent;
  border: 0;
  color: #cfe0e6;
  font-size: 12.5px;
  padding: 6px 13px;
  border-radius: 4px;
  cursor: pointer;
}
.menubar button:hover { background: rgba(255, 255, 255, .1); }
.menubar button.on { background: var(--accent); color: #fff; }

.body { display: flex; flex: 1; min-height: 0; }

.tree {
  width: 186px;
  background: #fff;
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 0;
}
.tree-title {
  font-size: 11.5px; color: var(--muted); padding: 6px 14px 8px;
  border-bottom: 1px solid #eef1f4; margin-bottom: 6px;
}
.tree .grp { font-size: 12px; color: var(--muted); padding: 8px 14px 4px; }
.tree a {
  display: block; padding: 7px 14px 7px 24px; color: #33434f; font-size: 12.5px;
  border-left: 3px solid transparent;
}
.tree a:hover { background: #f2f7f9; }
.tree a.on { background: #e8f4f7; color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabstrip {
  height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: #e9eef2; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.tabstrip .tab {
  background: #fff; border: 1px solid var(--line); border-bottom: 0;
  padding: 4px 12px; border-radius: 4px 4px 0 0; color: var(--ink);
}
.page { flex: 1; overflow: auto; padding: 12px; }

.side {
  width: 262px;
  background: #fff;
  border-left: 1px solid var(--line);
  overflow: auto;
  padding: 10px;
}
.side-block { border: 1px solid #e6ecf0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
.side-block .hd {
  background: #f3f7f9; padding: 7px 10px; font-size: 12px; font-weight: 600;
  color: #3b4c58; border-bottom: 1px solid #e6ecf0;
}
.side-block .bd { padding: 9px 10px; }
.side-kv { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
.side-kv span { color: var(--muted); }

.statusbar {
  height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px;
  background: #16323d; color: #b9cdd6; font-size: 11.5px;
}
.statusbar b { color: #eaf2f5; font-weight: 600; }

/* ---------------------------------------------------------------- 通用块 */
.panel {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(16, 36, 44, .04);
}
.panel-title {
  padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #2c3e4a;
  border-bottom: 1px solid #edf1f4; display: flex; align-items: center; gap: 8px;
}
.panel-body { padding: 12px; }
.panel-body.flush { padding: 0; }
.panel-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi-grid.six { grid-template-columns: repeat(6, 1fr); }
.kpi-grid.three { grid-template-columns: repeat(3, 1fr); }
.kpi {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px;
  border-top: 3px solid var(--accent);
}
.kpi.gold { border-top-color: var(--gold); }
.kpi.green { border-top-color: var(--down); }
.kpi.red { border-top-color: var(--up); }
.kpi .k-label { font-size: 11.5px; color: var(--muted); }
.kpi .k-value { font-size: 21px; font-weight: 700; margin-top: 5px; letter-spacing: -.3px; }
.kpi .k-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

table.grid-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid-table th {
  background: #f4f7f9; text-align: left; padding: 8px 10px; font-weight: 600;
  color: #46586a; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid-table td { padding: 7px 10px; border-bottom: 1px solid #eef2f5; }
table.grid-table tbody tr:hover { background: #f8fbfc; }
table.grid-table tr.clickable { cursor: pointer; }
table.grid-table .empty-row td { text-align: center; color: var(--muted); padding: 26px; }
table.grid-table td.num, table.grid-table th.num { text-align: right; font-family: Consolas, monospace; }

.tag {
  display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
  background: #eef2f5; color: #55636f; line-height: 18px;
}
.tag.blue { background: #e3f1f5; color: #1f7a8c; }
.tag.green { background: #e6f4ec; color: #1e8449; }
.tag.red { background: #fbeae7; color: #c0392b; }
.tag.gold { background: #fbf2e0; color: #a9772a; }
.tag.gray { background: #eef2f5; color: #6b7a88; }

.btn {
  border: 1px solid var(--line); background: #fff; color: #33434f; padding: 5px 13px;
  border-radius: 4px; cursor: pointer; font-size: 12.5px;
}
.btn:hover { border-color: var(--accent2); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { color: var(--up); border-color: #eccdc9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }

input[type=text], input[type=number], input[type=date], select, textarea {
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12.5px;
  color: var(--ink); background: #fff; outline: none; font-family: inherit;
}
input:focus, select:focus { border-color: var(--accent2); }
.form-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label { font-size: 12px; color: var(--muted); }

.msg-list { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.msg-list .err { color: var(--up); }
.msg-list .warn { color: var(--warn); }
.msg-list .pass { color: var(--down); }

.progress {
  height: 6px; background: #eef2f5; border-radius: 3px; overflow: hidden; width: 90px;
  display: inline-block; vertical-align: middle;
}
.progress i { display: block; height: 100%; background: var(--accent2); }

.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 20px; }
.spark i { width: 4px; display: block; background: #cfd8de; }

/* 抽屉 / 弹窗 */
.mask {
  position: fixed; inset: 0; background: rgba(10, 24, 30, .45); display: none;
  align-items: center; justify-content: center; z-index: 90;
}
.mask.on { display: flex; }
.dialog {
  background: #fff; border-radius: 8px; width: 860px; max-width: 94vw; max-height: 88vh;
  overflow: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.dialog .dh {
  padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
  display: flex; align-items: center;
}
.dialog .dh .x { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 16px; }
.dialog .db { padding: 14px 16px; }
.dialog .df {
  padding: 11px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px;
  justify-content: flex-end;
}

/* 登录页 */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 20% 20%, #1d4453, #0c1a21 65%);
}
.login-card {
  width: 880px; display: flex; background: #fff; border-radius: 10px; overflow: hidden;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
}
.login-left {
  width: 420px; padding: 42px 36px; color: #eaf4f7;
  background: linear-gradient(160deg, #17505f, #0f2a34);
  display: flex; flex-direction: column;
}
.login-left .lg { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
.login-left .sub { font-size: 12.5px; color: #9fc3cf; margin-top: 8px; line-height: 1.9; }
.login-left ul { margin: 22px 0 0; padding-left: 18px; font-size: 12px; color: #bcd6de; line-height: 2; }
.login-right { flex: 1; padding: 46px 40px; }
.login-right h2 { margin: 0 0 6px; font-size: 18px; }
.login-right .hint { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
.login-right .field { margin-bottom: 14px; }
.login-right .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.login-right .field input { width: 100%; padding: 9px 11px; }
.login-right .btn.primary { width: 100%; padding: 9px; margin-top: 6px; font-size: 13.5px; }
.login-err { color: var(--up); font-size: 12px; min-height: 18px; margin-top: 8px; }
.login-demo { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.9; }

.chart-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }
.chart-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }

/* ---------------------------------------------------------- 流程审批 */
.nav-badge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 6px;
  background: var(--up, #c0392b); color: #fff; border-radius: 9px; font-size: 10.5px;
  line-height: 16px; text-align: center; font-weight: 600; }

.btn.xs { padding: 2px 8px; font-size: 11.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.apv-title { font-size: 15px; font-weight: 600; margin: 6px 0 4px; }

.apv-nodes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.apv-node { display: flex; gap: 8px; align-items: flex-start; min-width: 168px; flex: 1;
  border: 1px solid #e3eaef; border-radius: 6px; padding: 8px 10px; background: #fbfcfd; }
.apv-node.on { border-color: var(--accent2); background: #eff9fb; }
.apv-node.ok { border-color: #9ed3b4; background: #f2fbf6; }
.apv-node.no { border-color: #e6b0a8; background: #fdf4f2; }
.apv-node.skip { opacity: .55; }
.apv-dot { width: 18px; height: 18px; border-radius: 50%; background: #eef2f5; color: #6b7a88;
  font-size: 11px; line-height: 18px; text-align: center; flex: 0 0 18px; }
.apv-node.on .apv-dot { background: var(--accent2); color: #fff; }
.apv-node.ok .apv-dot { background: #1e8449; color: #fff; }
.apv-node.no .apv-dot { background: #c0392b; color: #fff; }
.apv-nb { min-width: 0; }
.apv-nm { font-size: 12.5px; font-weight: 600; }
.apv-cs { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.apv-chip { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #eef2f5; color: #5d6f7c; }
.apv-chip.on { background: #fbf2e0; color: #a9772a; }
.apv-chip.no { background: #fbeae7; color: #c0392b; }

.apv-tl { border-left: 2px solid #e3eaef; margin-left: 6px; padding-left: 12px; }
.apv-ti { position: relative; padding: 3px 0 7px; font-size: 12px; }
.apv-ti::before { content: ""; position: absolute; left: -18px; top: 8px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2); }
.apv-time { color: #8b9aa6; margin-right: 8px; }
.apv-act { font-weight: 600; margin-right: 6px; }
.apv-who { color: #33475b; margin-right: 6px; }
.apv-cm { color: #5d6f7c; margin: 3px 0 0 2px; line-height: 1.7; }

.apv-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; font-size: 12.5px; }
.apv-form i { display: block; font-style: normal; color: #8b9aa6; font-size: 11px; }

.apv-ncard { border: 1px dashed #d6e0e7; border-radius: 6px; padding: 6px 10px 2px; margin-bottom: 8px; background: #fbfcfd; }
.apv-ncard .form-row { margin-bottom: 4px; }

/* ---------------------------------------------------------- CRM 组件 */
.kpi-grid.four { grid-template-columns: repeat(4, 1fr); }
.kpi-grid.five { grid-template-columns: repeat(5, 1fr); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: #4a5b68; border-radius: 14px;
  padding: 3px 11px; font-size: 12px; cursor: pointer;
}
.chip b { margin-left: 6px; color: var(--muted); font-weight: 600; }
.chip.on { background: #e8f4f7; border-color: var(--accent2); color: var(--accent); }
.chip.on b { color: var(--accent); }

.empty-hint { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }

/* 看板 */
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.board .col {
  flex: 1 0 200px; background: #f7fafb; border: 1px solid #e6ecf0; border-radius: 6px;
  padding: 8px; min-height: 220px;
}
.board .col-hd {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin-bottom: 8px;
  display: flex; justify-content: space-between;
}
.board .col-hd span { font-weight: 400; color: var(--muted); font-size: 11px; }
.card {
  background: #fff; border: 1px solid #e3eaef; border-radius: 5px; padding: 8px 9px;
  margin-bottom: 7px; cursor: pointer; box-shadow: 0 1px 1px rgba(16, 36, 44, .03);
}
.card:hover { border-color: var(--accent2); box-shadow: 0 2px 8px rgba(31, 122, 140, .12); }
.card-t { font-size: 12.5px; font-weight: 600; color: #263943; line-height: 1.4; }
.card-c { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.card-m { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-size: 11.5px; }
.card-m b { font-size: 13px; color: #1f7a8c; }
.card-m span { color: var(--muted); }
.card-f { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* 漏斗 */
.funnel { display: flex; flex-direction: column; gap: 7px; }
.fn-row { display: grid; grid-template-columns: 150px 1fr 120px 60px; gap: 10px; align-items: center; }
.fn-name { font-size: 12.5px; color: #33434f; }
.fn-bar { height: 18px; background: #eef3f6; border-radius: 3px; overflow: hidden; }
.fn-bar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #2b9eb3, #1f7a8c);
}
.fn-val { font-size: 12px; text-align: right; font-family: Consolas, monospace; }
.fn-conv { font-size: 11.5px; color: var(--down); text-align: right; }
.funnel-mini { display: flex; gap: 10px; flex-wrap: wrap; }
.funnel-mini .fm {
  flex: 1 0 120px; border: 1px solid #e6ecf0; border-radius: 5px; padding: 8px 10px;
  background: #fbfdfe;
}
.funnel-mini .fm-v { font-size: 15px; font-weight: 700; color: #1f7a8c; }
.funnel-mini .fm-l { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* 时间线 */
.timeline { border-left: 2px solid #e3eaef; margin: 4px 0 4px 6px; padding-left: 12px; }
.tl-item { position: relative; padding: 3px 0 8px; font-size: 12px; color: #33434f; line-height: 1.7; }
.tl-item::before {
  content: ""; position: absolute; left: -17px; top: 9px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2);
}
.tl-time { color: #8b9aa6; margin-right: 8px; font-family: Consolas, monospace; font-size: 11px; }

/* 详情头 */
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.dh-title { font-size: 16px; font-weight: 600; color: #22333d; }
.dh-tags { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.section-title {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin: 14px 0 8px;
  border-left: 3px solid var(--accent2); padding-left: 8px;
}
.note {
  background: #f6f9fb; border: 1px solid #e6ecf0; border-radius: 5px; padding: 9px 11px;
  font-size: 12.5px; color: #42555f; line-height: 1.8; margin: 8px 0;
}
.warn-box {
  background: #fdf6e9; border: 1px solid #f0dcb8; color: #8a6420; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.ok-box {
  background: #f1faf4; border: 1px solid #c9e8d5; color: #1e6b43; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.form-grid { display: grid; grid-template-columns: 110px 1fr 110px 1fr; gap: 8px 10px; align-items: center; }
.form-grid label { font-size: 12px; color: var(--muted); text-align: right; }
.form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
.gate { display: flex; flex-direction: column; gap: 5px; }
.gate-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0;
  border-bottom: 1px dashed #eef2f5; }

.score {
  display: inline-block; min-width: 28px; text-align: center; padding: 1px 6px;
  border-radius: 4px; font-size: 11.5px; font-weight: 700; font-family: Consolas, monospace;
}
.score.green { background: #e6f4ec; color: #1e8449; }
.score.blue { background: #e3f1f5; color: #1f7a8c; }
.score.gold { background: #fbf2e0; color: #a9772a; }
.score.red { background: #fbeae7; color: #c0392b; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px;
  background: #eef2f5; color: #55636f; }
.pill.s2 { background: #fbf2e0; color: #a9772a; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button {
  border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 14px;
  font-size: 12.5px; color: #55636f; cursor: pointer; border-radius: 4px 4px 0 0;
}
.tabs button.on { background: #fff; border-color: var(--line); color: var(--accent); font-weight: 600; }

.code {
  background: #0f2029; color: #d7e6ec; border-radius: 5px; padding: 9px 11px; font-size: 11.5px;
  font-family: Consolas, monospace; line-height: 1.7; overflow-x: auto; white-space: pre;
  margin: 6px 0 0;
}
code { background: #f1f5f8; padding: 1px 5px; border-radius: 3px; font-size: 11.5px;
  font-family: Consolas, monospace; color: #1f5f6d; }
.keybox {
  font-family: Consolas, monospace; font-size: 12.5px; background: #0f2029; color: #9ee6b8;
  padding: 12px; border-radius: 5px; word-break: break-all; margin: 8px 0;
}
.intg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

      promiseDate: req.needDate || "", owner: DB.me.username, ownerName: DB.me.displayName,
      approver: "", approvedAt: "", orderedAt: "", orderedQty: poItems.reduce(function (a, i) { return a + i.qty; }, 0),

    opt = opt || {};
    var url = String(input);
    var mPath = url.match(/api\/[^?#]+/) || url.match(/^api\/[^?#]+/);
    if (!mPath) return _fetch ? _fetch(input, opt) : Promise.reject(new Error("no fetch"));
    var path = mPath[0].replace(/^\//, "");
    var qs = {};
    var qi = path.indexOf("?");
    if (qi >= 0) {
      path.slice(qi + 1).split("&").forEach(function (kv) {
        if (!kv) return;
        var j = kv.indexOf("=");
        qs[decodeURIComponent(j < 0 ? kv : kv.slice(0, j))] =
          decodeURIComponent(j < 0 ? "" : kv.slice(j + 1));
      });
      path = path.slice(0, qi);
    }
    var method = (opt.method || "GET").toUpperCase();
    var body = {};
    if (opt.body) { try { body = JSON.parse(opt.body); } catch (e) { body = {}; } }
    for (var i = 0; i < ROUTES.length; i++) {
      var r = ROUTES[i];
      if (r[0] !== method) continue;
      var m = path.match(r[1]);

      try {
        out = r[2](m, qs, body);

      return Promise.resolve({
        status: out.status,
        ok: out.status < 400,
        json: function () { return Promise.resolve(out.body); }
      });
    }
    return Promise.resolve({ status: 404, ok: false,
      json: function () { return Promise.resolve({ error: "DEMO 未模拟该接口：" + method + " " + path }); } });

  } catch (e) { /* 隐私模式忽略 */ }
})();

  /* ---------------------------------------------------------- 请求 */
  F.raw = function (method, path, body, headers) {
    var h = { "Content-Type": "application/json" };
    var tk = localStorage.getItem(TOKEN_KEY);
    if (tk) { h.Authorization = "Bearer " + tk; h["X-Fq-Token"] = tk; }
    Object.keys(headers || {}).forEach(function (k) { h[k] = headers[k]; });
    var opt = { method: method, headers: h };
    if (body !== undefined && body !== null) opt.body = JSON.stringify(body);
    return fetch(path.replace(/^\//, ""), opt).then(function (r) {
      return r.json().catch(function () { return { error: "响应解析失败" }; })
        .then(function (j) { return { status: r.status, body: j }; });

  F.api = function (method, path, body) {

      if (x.status === 401) {

        location.href = "./login.html";
        return new Promise(function () {});
      }
      if (x.status >= 400) {
        var e = new Error((x.body && x.body.error) || ("请求失败 " + x.status));
        e.status = x.status;
        e.body = x.body;
        throw e;
      }
      return x.body.data;
    });
  };

  F.toast = function (msg, kind) {

    clearTimeout(F._t);
    F._t = setTimeout(function () { el.style.color = ""; }, 8000);
  };
  F.setStatus = function (t) {
    var el = document.getElementById("statusMsg");
    if (!el) return;
    if (F._toastUntil && Date.now() < F._toastUntil) return;
    el.textContent = t;
  };
  F.setSide = function (html) { var el = document.getElementById("side"); if (el) el.innerHTML = html; };

  /* ---------------------------------------------------------- 路由 */
  function parseHash() {
    var h = (location.hash || "#dashboard").replace(/^#\/?/, "");
    var i = h.indexOf("?");
    var route = i < 0 ? h : h.slice(0, i);
    var qs = i < 0 ? "" : h.slice(i + 1);
    var params = {};
    qs.split("&").forEach(function (kv) {
      if (!kv) return;
      var j = kv.indexOf("=");
      params[decodeURIComponent(j < 0 ? kv : kv.slice(0, j))] =
        decodeURIComponent(j < 0 ? "" : kv.slice(j + 1));
    });
    return { route: route || "dashboard", params: params };
  }

  F.go = function (route, params) {
    location.hash = "#" + route + (params && Object.keys(params).length ? "?" + F.qs(params) : "");
  };

  var PAGES = {};
  F.register = function (name, fn) { PAGES[name] = fn; };

    var min = opts.zero === false ? Math.min.apply(null, all) : 0;

    var colors = opts.colors || ["#1f7a8c", "#c8963e", "#7a5ea8"];
    var w = (W - P * 2) / Math.max(1, labels.length - 1);
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (t) {
      var y = P + (H - P * 1.6) * t;
      var val = max - span * t;
      return '<line x1="' + P + '" y1="' + y + '" x2="' + (W - P) + '" y2="' + y +
        '" stroke="#eef2f5"/><text x="6" y="' + (y + 4) + '" font-size="10" fill="#8b9aa6">' +
        (val >= 10000 ? (val / 10000).toFixed(1) + "万" : Math.round(val)) + "</text>";
    }).join("");
    var paths = series.map(function (s, si) {
      var d = s.data.map(function (v, i) {
        var x = P + w * i;
        var y = P + (H - P * 1.6) * (1 - (v - min) / span);
        return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }).join(" ");
      return '<path d="' + d + '" fill="none" stroke="' + colors[si % colors.length] +
        '" stroke-width="2"/>' + s.data.map(function (v, i) {
          var x = P + w * i;
          var y = P + (H - P * 1.6) * (1 - (v - min) / span);
          return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="' +
            colors[si % colors.length] + '"/>';
        }).join("");
    }).join("");
    var xlabels = labels.map(function (t, i) {
      return '<text x="' + (P + w * i) + '" y="' + (H - 6) +
        '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(t) + "</text>";
    }).join("");
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      grid + paths + xlabels + "</svg>";
  };

  F.barChart = function (items, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 180, P = 34;
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    var gap = (W - P * 2) / Math.max(1, items.length);
    var bw = gap * 0.56;
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      items.map(function (it, i) {
        var h = (H - P * 1.8) * (it.value / max);
        var x = P + gap * i + (gap - bw) / 2;
        var y = H - P - h;
        return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
          '" height="' + h.toFixed(1) + '" rx="2" fill="' + (it.color || "#2b9eb3") + '"/>' +
          '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5) +
          '" font-size="10" fill="#5d6f7c" text-anchor="middle">' + F.esc(it.label2 || "") +
          "</text>" + '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) +
          '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(it.label) + "</text>";
      }).join("") + "</svg>";
  };

  // 阶段分布条（采购订单流程）
  F.flowBars = function (stages) {
    var max = Math.max.apply(null, stages.map(function (s) { return s.amount; }).concat([1]));
    return '<div class="funnel">' + stages.map(function (s) {
      var w = Math.max(6, Math.round(s.amount / max * 100));
      return '<div class="fn-row"><div class="fn-name">' + F.esc(s.stage) + "</div>" +
        '<div class="fn-bar"><i style="width:' + w + '%"></i></div>' +
        '<div class="fn-val">' + F.wan(s.amount) + ' <span class="muted small">' + s.count + " 单</span></div>" +
        '<div class="fn-conv">' + (s.count ? "" : "—") + "</div></div>";
    }).join("") + "</div>";
  };

  F.empty = function (text) {
    return '<div class="empty-hint">' + F.esc(text || "暂无数据") + "</div>";
  };

  F.kv = function (label, value) {
    return '<div class="side-kv"><span>' + F.esc(label) + "</span><b>" + value + "</b></div>";
  };

  /* ---------------------------------------------------------- 驾驶舱 */
  F.register("dashboard", function () {
    var b = F.state.boot;
    if (!b) return;
    var k = b.kpi;
    var html = '<div class="kpi-grid six">' +
      '<div class="kpi"><div class="k-label">在途采购</div><div class="k-value">' + F.wan(k.openAmount) +
      '</div><div class="k-sub">' + k.openCount + " 单 · 待审批 " + k.pendingApprove + "</div></div>" +
      '<div class="kpi green"><div class="k-label">本月到货金额</div><div class="k-value">' +
      F.wan(k.monthReceive) + '</div><div class="k-sub">近 90 天准时率 ' + F.pct(k.onTimeRate, 0) + "</div></div>" +
      '<div class="kpi"><div class="k-label">库存金额</div><div class="k-value">' + F.wan(k.stockValue) +
      '</div><div class="k-sub">本月领用 ' + F.wan(k.monthIssue) + "</div></div>" +
      '<div class="kpi red"><div class="k-label">缺料预警</div><div class="k-value">' + k.shortageCount +
      '</div><div class="k-sub">近效期批次 ' + k.expiringCount + " 个</div></div>" +
      '<div class="kpi gold"><div class="k-label">待处理发票</div><div class="k-value">' +
      k.pendingInvoice + '</div><div class="k-sub">逾期应付 ' + F.wan(k.overduePayable) + "</div></div>" +
      '<div class="kpi"><div class="k-label">供应商 / 物料</div><div class="k-value">' +
      k.supplierCount + '</div><div class="k-sub">已准入 ' + k.activeSupplier + " · 物料 " +
      k.materialCount + " 项</div></div></div>";

    html += '<div class="panel"><div class="panel-title">采购订单流程分布' +
      '<span class="panel-actions small muted">在途金额 ' + F.wan(k.openAmount) + "</span></div>" +
      '<div class="panel-body">' + F.flowBars(b.poStages || []) + "</div></div>";

    html += '<div class="panel"><div class="panel-title">近 6 个月采购金额</div><div class="panel-body">' +
      F.lineChart([{ name: "amount", data: (b.trend || []).map(function (t) { return t.amount; }) }],
        { labels: (b.trend || []).map(function (t) { return t.month.slice(5) + "月"; }) }) +
      "</div></div>";

    html += '<div class="panel"><div class="panel-title">待办与预警' +
      '<span class="panel-actions"><a class="btn sm" href="#reports">看报表</a></span></div>' +
      '<div class="panel-body flush">' +
      F.table([
        { label: "类别", render: function (r) { return F.tag(r.kind, "gray"); } },
        { label: "对象", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
        { label: "事项", render: function (r) { return F.esc(r.title); } },
        { label: "状态", render: function (r) { return F.tag(r.tag, r.level); } }
      ], b.todos || [], { empty: "没有待办，节奏不错" }) + "</div></div>";

    html += '<div class="panel"><div class="panel-title">缺料与补货建议' +
      '<span class="panel-actions small muted">共 ' + k.shortageCount + " 项</span></div>" +
      '<div class="panel-body flush">' +
      F.table([
        { label: "物料", render: function (r) { return F.esc(r.materialName) +
          '<div class="muted small mono">' + F.esc(r.materialCode) + "</div>"; } },
        { label: "现存量", num: true, render: function (r) { return F.qty(r.onHand) + " " + F.esc(r.unit); } },
        { label: "安全库存", num: true, render: function (r) { return F.qty(r.safetyStock); } },
        { label: "建议补货", num: true, render: function (r) { return '<b class="up">' + F.qty(r.gap) + "</b>"; } },
        { label: "状态", render: function (r) { return F.tag(r.state); } }
      ], b.shortages || [], { empty: "库存健康，暂无缺料" }) + "</div></div>";

    document.getElementById("view").innerHTML = html;

    var supList = (b.topSuppliers || []).map(function (s) {
      return '<div class="side-kv"><span>' + F.esc(String(s.name).slice(0, 10)) + "</span><b>" +
        F.wan(s.amount) + "</b></div>";
    }).join("");
    F.setSide(
      '<div class="side-block"><div class="hd">本月快照</div><div class="bd">' +
      F.kv("本月到货", '<span class="up">' + F.wan(k.monthReceive) + "</span>") +
      F.kv("在途采购", F.wan(k.openAmount)) +
      F.kv("库存金额", F.wan(k.stockValue)) +
      F.kv("逾期应付", '<span class="up">' + F.wan(k.overduePayable) + "</span>") +
      "</div></div>" +
      '<div class="side-block"><div class="hd">采购额 TOP 供应商</div><div class="bd">' +
      (supList || '<div class="muted small">暂无数据</div>') + "</div></div>" +
      '<div class="side-block"><div class="hd">资质预警</div><div class="bd">' +
      ((b.qualWarn || []).length ? (b.qualWarn || []).map(function (q) {
        return '<div class="side-kv"><span>' + F.esc(String(q.supplierName).slice(0, 9)) + "</span><b>" +
          F.tag(q.state) + "</b></div>";
      }).join("") : '<div class="muted small">资质均在有效期内</div>') + "</div></div>" +
      '<div class="side-block"><div class="hd">业务规则</div><div class="bd small muted" style="line-height:1.9">' +
      (b.rules || []).map(function (r) {
        return (r.enabled ? "● " : "○ ") + F.esc(r.name) + "：" + r.value + F.esc(r.unit || "") +
          (r.enabled ? "" : "（停用）");
      }).join("<br>") + "</div></div>");
    F.setStatus("供应链驾驶舱 · 数据截至 " + b.today);
  });

  /* ---------------------------------------------------------- 设置 */
  F.register("settings", function () {
    F.api("GET", "/api/settings").then(function (d) {
      var role = localStorage.getItem("fq_role") || "";
      var html = '<div class="panel"><div class="panel-title">业务规则' +
        (role === "admin" ? '<span class="panel-actions small muted">管理员可启停与调整阈值</span>' : "") +
        "</div><div class='panel-body flush'>" +
        F.table([
          { label: "规则", render: function (r) { return F.esc(r.name) + ' <span class="muted small mono">' +
            F.esc(r.code) + "</span>"; } },
          { label: "分类", render: function (r) { return F.tag(r.category, "gray"); } },
          { label: "阈值", num: true, render: function (r) {
            if (role !== "admin") return r.value + F.esc(r.unit || "");
            return '<input type="number" step="any" data-rule-val="' + F.esc(r.code) +
              '" value="' + r.value + '" style="width:90px"> <span class="small muted">' +
              F.esc(r.unit || "") + "</span>";
          } },
          { label: "说明", render: function (r) { return '<span class="small muted">' + F.esc(r.remark) + "</span>"; } },
          { label: "状态", render: function (r) {
            if (role !== "admin") return r.enabled ? F.tag("启用") : F.tag("停用");
            return '<label class="small"><input type="checkbox" data-rule="' + F.esc(r.code) + '"' +
              (r.enabled ? " checked" : "") + "> 启用</label>";
          } }
        ], d.rules || []) + "</div></div>" +
        '<div class="panel"><div class="panel-title">仓网与预算</div><div class="panel-body">' +
        '<div class="small muted" style="margin-bottom:8px">仓库</div>' +
        F.table([{ label: "编码", key: "code" }, { label: "名称", key: "name" },
          { label: "地址", key: "location" }, { label: "保管人", key: "keeper" },
          { label: "说明", render: function (r) { return '<span class="small muted">' + F.esc(r.remark) + "</span>"; } }],
          d.warehouses || []) +
        '<div class="small muted" style="margin:12px 0 8px">部门采购预算</div>' +
        F.table([{ label: "期间", key: "period" }, { label: "部门", key: "dept" },
          { label: "预算", num: true, render: function (r) { return F.money(r.amount); } },
          { label: "已用", num: true, render: function (r) { return F.money(r.used); } },
          { label: "执行率", num: true, render: function (r) {
            var p = r.amount ? r.used / r.amount : 0;
            return (p > 1 ? '<b class="up">' : "") + F.pct(p, 1) + (p > 1 ? "</b>" : "");
          } },
          { label: "备注", render: function (r) { return '<span class="small muted">' + F.esc(r.remark) + "</span>"; } }],
          d.budgets || []) +
        "</div></div>" +
        '<div class="panel"><div class="panel-title">用户与角色</div><div class="panel-body flush">' +
        F.table([{ label: "账号", key: "username" }, { label: "姓名", key: "display_name" },
          { label: "角色", render: function (r) { return F.tag(r.role, "gray"); } },
          { label: "部门", key: "dept_code" }, { label: "手机", key: "phone" }], d.users || []) +
        "</div></div>";
      document.getElementById("view").innerHTML = html;
      document.querySelectorAll("[data-rule]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var code = cb.getAttribute("data-rule");
          F.api("PUT", "/api/rules/" + encodeURIComponent(code), { enabled: cb.checked })
            .then(function () { F.toast("规则已" + (cb.checked ? "启用" : "停用") + "：" + code, "ok"); })
            .catch(function (e) { cb.checked = !cb.checked; F.toast(e.message, "err"); });
        });
      });
      document.querySelectorAll("[data-rule-val]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var code = inp.getAttribute("data-rule-val");
          F.api("PUT", "/api/rules/" + encodeURIComponent(code), { value: Number(inp.value) })
            .then(function () { F.toast("阈值已更新：" + code + " = " + inp.value, "ok"); })
            .catch(function (e) { F.toast(e.message, "err"); });
        });
      });
      F.setStatus("基础设置 · " + (d.rules || []).length + " 条业务规则");
      F.setSide('<div class="side-block"><div class="hd">当前登录</div><div class="bd">' +
        F.kv("账号", F.esc(localStorage.getItem("fq_user") || "")) +
        F.kv("姓名", F.esc(localStorage.getItem("fq_name") || "")) +
        F.kv("角色", F.esc(localStorage.getItem("fq_role_label") || "")) +
        "</div></div>" +
        '<div class="side-block"><div class="hd">规则口径提示</div><div class="bd small muted" style="line-height:1.9">' +
        "规则调整立即生效并写入操作日志：三单匹配容差影响结算判定，请购免审批金额影响提交路径，" +
        "资质与效期预警天数影响驾驶舱预警清单。</div></div>");
    });
  });

  /* ---------------------------------------------------------- 日志 */
  F.register("logs", function () {
    F.api("GET", "/api/logs").then(function (list) {
      document.getElementById("view").innerHTML =
        '<div class="panel"><div class="panel-title">操作日志' +
        '<span class="panel-actions small muted">最近 200 条</span></div><div class="panel-body flush">' +
        F.table([
          { label: "时间", render: function (r) { return '<span class="small muted">' + F.esc(r.created_at) + "</span>"; } },
          { label: "操作员", key: "username" },
          { label: "动作", render: function (r) { return F.tag(r.action, "blue"); } },
          { label: "详情", render: function (r) { return '<span class="small">' + F.esc(r.detail || "—") + "</span>"; } }
        ], list, { empty: "暂无日志" }) + "</div></div>";
      F.setStatus("操作日志 · " + list.length + " 条");
    });
  });

  /* ---------------------------------------------------------- 启动 */
  function boot() {
    if (!localStorage.getItem(TOKEN_KEY)) {
      location.href = "./login.html";
      return;
    }
    var lg = document.getElementById("btnLogout");
    if (lg) {
      lg.addEventListener("click", function () {
        F.api("POST", "/api/auth/logout", {}).catch(function () {}).then(function () {
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem("fq_user");
          location.href = "./login.html";
        });
      });
    }
    var foot = document.getElementById("opFoot");
    if (foot) {
      foot.textContent = "操作员：" + (localStorage.getItem("fq_name") || "") +
        "（" + (localStorage.getItem("fq_role_label") || "") + "）";
    }
    F.reload().then(function () {
      window.addEventListener("hashchange", render);
      if (!location.hash) location.hash = "dashboard";
      render();
      F.setStatus("系统就绪 · 演示数据为确定性生成");
    }).catch(function (e) {
      F.toast("初始化失败：" + e.message, "err");
    });
  }

  F.reload = function () {
    return F.api("GET", "/api/bootstrap").then(function (d) {
      F.state.boot = d;
      var a = document.getElementById("pipeLabel");
      if (a) a.textContent = "在途采购：" + F.wan(d.kpi.openAmount);
      var r = document.getElementById("wonLabel");
      if (r) r.textContent = "本月到货：" + F.wan(d.kpi.monthReceive);
      localStorage.setItem("fq_role", d.user.role);
      return d;
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(window, document);

</script>
<script>
/* 飞泉 SCM · 供应商档案（360）与物料主数据 */
(function (window, document) {
  "use strict";
  var F = window.F;

  function me() { return (F.state.boot && F.state.boot.user) || {}; }
  function canWrite() {
    var r = me().role;
    return r === "admin" || r === "purchase_director" || r === "buyer" || r === "planner";
  }
  function canApprove() {
    var r = me().role;
    return r === "admin" || r === "purchase_director";
  }
  F.canWrite = canWrite;
  F.canApprove = canApprove;
  F.me = me;

  F.showErr = function (e) {
    var msg = e && e.message ? e.message : String(e);
    if (e && e.body && e.body.dups && e.body.dups.length) {
      msg += "：" + e.body.dups.map(function (d) {
        return (d.name || d.code) + "（" + (d.reason || "重复") + "）";
      }).join("；");
    }
    if (e && e.body && e.body.missing && e.body.missing.length) {
      msg += "（" + e.body.missing.join("、") + "）";
    }
    F.toast(msg, "err");
    return msg;
  };

  /* ============================================================ 供应商 */
  F.register("suppliers", function () {
    var st = { status: "全部", level: "全部", kw: "" };

    function draw() {
      F.api("GET", "/api/suppliers?" + F.qs({ status: st.status, level: st.level, kw: st.kw }))
        .then(function (d) {
          var counts = { "全部": d.total };
          d.list.forEach(function (s) { counts[s.status] = (counts[s.status] || 0) + 1; });
          var chips = ["全部", "待准入", "已准入", "观察", "冻结"].map(function (s) {
            return '<button class="chip ' + (st.status === s ? "on" : "") + '" data-st="' + s + '">' +
              s + "<b>" + (counts[s] || 0) + "</b></button>";
          }).join("");
          var html = '<div class="panel"><div class="panel-title">供应商档案' +
            '<span class="panel-actions">' +
            '<input id="fKw" type="text" placeholder="名称 / 编码 / 联系人" value="' + F.esc(st.kw) +
            '" style="width:180px">' +
            '<select id="fLevel">' + ["全部", "A", "B", "C", "D"].map(function (v) {
              return '<option' + (v === st.level ? " selected" : "") + ">" + v + "</option>";
            }).join("") + "</select>" +
            '<button class="btn sm" id="btnSearch">查询</button>' +
            (canWrite() ? '<button class="btn sm primary" id="sNew">+ 新建供应商</button>' : "") +
            "</span></div>" +
            '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
            '<div class="panel-body flush">' +
            F.table([
              { label: "编码", render: function (r) { return '<span class="mono small">' + F.esc(r.code) + "</span>"; } },
              { label: "供应商", render: function (r) { return '<b>' + F.esc(r.name) + "</b>" +
                '<div class="muted small">' + F.esc(r.category) + " · " + F.esc(r.contact || "—") +
                " · 账期 " + r.paymentTerms + " 天 · 提前期 " + r.leadDays + " 天</div>"; } },
              { label: "等级", render: function (r) { return F.levelTag(r.level); } },
              { label: "综合分", num: true, render: function (r) { return F.scoreBadge(r.score); } },
              { label: "资质", render: function (r) {
                var t = r.qualCount + " 项";
                if (r.qualWorst === "过期") return '<b class="up">' + t + "（有过期）</b>";
                if (r.qualWorst === "临期") return '<span class="up">' + t + "（临期）</span>";
                return t;
              } },
              { label: "采购额", num: true, render: function (r) { return F.wan(r.poAmount); } },
              { label: "状态", render: function (r) { return F.tag(r.status); } }
            ], d.list, { click: function (r) { return r.code; }, empty: "没有匹配的供应商" }) +
            "</div></div>";
          document.getElementById("view").innerHTML = html;
          document.getElementById("btnSearch").addEventListener("click", function () {
            st.kw = document.getElementById("fKw").value.trim();
            st.level = document.getElementById("fLevel").value;
            draw();
          });
          document.getElementById("fKw").addEventListener("keydown", function (e) {
            if (e.key === "Enter") document.getElementById("btnSearch").click();
          });
          var nb = document.getElementById("sNew");
          if (nb) nb.addEventListener("click", newSupplier);
          document.querySelectorAll("[data-st]").forEach(function (b) {
            b.addEventListener("click", function () { st.status = b.getAttribute("data-st"); draw(); });
          });
          F.bindRows(document, function (code) { openSupplier(code); });
          F.setStatus("供应商档案 · " + d.total + " 家（已准入 " + (counts["已准入"] || 0) + "）");
          var byLevel = {};
          d.list.forEach(function (s) { byLevel[s.level] = (byLevel[s.level] || 0) + 1; });

    function newSupplier() {

          .then(function (r) {
            var hit = (r.list || []).filter(function (s) { return s.name.indexOf(nameEl.value.trim()) >= 0; });
            var hint = document.getElementById("dupHint");
            hint.innerHTML = hit.length
              ? '<span class="up">已有同名/相似供应商：' + hit.map(function (s) {

              { label: "金额", num: true, render: function (r) { return F.wan(r.amount); } },
              { label: "状态", render: function (r) { return F.tag(r.status); } },
              { label: "到货进度", num: true, render: function (r) {
                return F.pct(r.orderedQty ? r.receivedQty / r.orderedQty : 0, 0);
              } },
              { label: "承诺到货", key: "promiseDate" }
            ], s.orders, { empty: "暂无采购订单" });
          } else if (key === "rc") {
            el.innerHTML = F.table([
              { label: "收货单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "订单", render: function (r) { return '<span class="mono small">' + F.esc(r.poNo) + "</span>"; } },
              { label: "到货日", key: "receivedAt" },
              { label: "质检", render: function (r) { return F.tag(r.inspectResult || "待检"); } },
              { label: "状态", render: function (r) { return F.tag(r.status); } }
            ], s.receipts, { empty: "暂无收货记录" });
          } else {
            el.innerHTML = F.table([
              { label: "发票", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "订单", render: function (r) { return '<span class="mono small">' + F.esc(r.poNo) + "</span>"; } },
              { label: "金额", num: true, render: function (r) { return F.money(r.amount); } },
              { label: "匹配", render: function (r) { return F.tag(r.matchResult || "待匹配"); } },
              { label: "状态", render: function (r) { return F.tag(r.status); } },
              { label: "到期", key: "dueDate" }
            ], s.invoices, { empty: "暂无发票" });
          }
        }
        pane("qual");
        document.querySelectorAll("#supTabs [data-tab]").forEach(function (b) {
          b.addEventListener("click", function () {
            document.querySelectorAll("#supTabs [data-tab]").forEach(function (x) { x.className = "chip"; });
            b.className = "chip on";
            pane(b.getAttribute("data-tab"));
          });
        });

        var qb = document.getElementById("sQual");
        if (qb) qb.addEventListener("click", function () { addQual(s.code, draw); });
        var sb = document.getElementById("sScore");
        if (sb) sb.addEventListener("click", function () { addScore(s.code, draw); });
        var ab = document.getElementById("sApprove");
        if (ab) ab.addEventListener("click", function () {
          F.api("POST", "/api/suppliers/" + s.code + "/status", { status: "已准入" })
            .then(function () { F.closeDialog(); F.toast("已准入：" + s.name, "ok"); draw(); })
            .catch(function (e) { F.showErr(e); });
        });
        var fb = document.getElementById("sFreeze");
        if (fb) fb.addEventListener("click", function () {
          F.api("POST", "/api/suppliers/" + s.code + "/status", { status: "冻结" })
            .then(function () { F.closeDialog(); F.toast("已冻结：" + s.name, "ok"); draw(); })
            .catch(function (e) { F.showErr(e); });
        });
        F.setStatus("供应商 360 · " + s.name);
      }).catch(function (e) { F.showErr(e); });
    }
    F.openSupplier = openSupplier;

    function addQual(code, after) {
      F.dialog("登记资质",
        '<div class="form-grid"><label>资质名称 *</label><input id="qName" type="text" placeholder="如 ISO9001 质量体系">' +
        '<label>证书号</label><input id="qNo" type="text"><label>发证日</label>' +
        '<input id="qIssued" type="date" value="' + F.today() + '">' +
        '<label>到期日 *</label><input id="qExpire" type="date" value="' + F.addDays(365) + '"></div>',

        }).then(function (r) {

          if (after) after();
        }).catch(function (e) { F.showErr(e); });

        '<button class="btn" data-close5="1">取消</button><button class="btn primary" id="pSave">算分并保存</button>');

          deliveryRate: Number(document.getElementById("pDelivery").value),

        }).then(function (r) {

          if (after) after();
        }).catch(function (e) { F.showErr(e); });

  });

  /* ============================================================ 物料 */
  F.register("materials", function () {
    var st = { kw: "", abc: "全部" };

    function draw() {
      F.api("GET", "/api/materials?" + F.qs({ kw: st.kw, abc: st.abc })).then(function (d) {
        var counts = { "全部": d.total, "A": 0, "B": 0, "C": 0 };
        d.list.forEach(function (m) { counts[m.abc] = (counts[m.abc] || 0) + 1; });
        var chips = ["全部", "A", "B", "C"].map(function (a) {
          return '<button class="chip ' + (st.abc === a ? "on" : "") + '" data-abc="' + a + '">' +
            (a === "全部" ? "全部" : a + " 类") + "<b>" + (counts[a] || 0) + "</b></button>";
        }).join("");
        var html = '<div class="panel"><div class="panel-title">物料主数据' +
          '<span class="panel-actions">' +
          '<input id="fKw" type="text" placeholder="编码 / 名称 / 规格" value="' + F.esc(st.kw) +
          '" style="width:180px">' +
          '<button class="btn sm" id="btnSearch">查询</button>' +
          (canWrite() ? '<button class="btn sm primary" id="mNew">+ 新建物料</button>' +
            '<button class="btn sm" id="mAbc">重算 ABC</button>' : "") +
          "</span></div>" +
          '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
          '<div class="panel-body flush">' +
          F.table([
            { label: "编码", render: function (r) { return '<span class="mono small">' + F.esc(r.code) + "</span>"; } },
            { label: "物料", render: function (r) { return '<b>' + F.esc(r.name) + "</b>" +
              '<div class="muted small">' + F.esc(r.spec) + "</div>"; } },
            { label: "分类", render: function (r) { return F.tag(r.abc, r.abc === "A" ? "green" : (r.abc === "B" ? "blue" : "gray")); } },
            { label: "单位", render: function (r) { return F.esc(r.unit); } },
            { label: "标准价", num: true, render: function (r) { return F.money(r.standardPrice); } },
            { label: "最近成交", num: true, render: function (r) { return F.money(r.lastPrice); } },
            { label: "现存量", num: true, render: function (r) {
              return F.qty(r.onHand) + ' <span class="muted small">' + F.esc(r.unit) + "</span>";
            } },
            { label: "库存状态", render: function (r) { return F.tag(r.stockState || "正常"); } },
            { label: "覆盖天数", num: true, render: function (r) {
              return r.coverageDays === null || r.coverageDays === undefined ? "—" : F.qty(r.coverageDays);
            } }
          ], d.list, { click: function (r) { return r.code; }, empty: "没有匹配的物料" }) +
          "</div></div>";
        document.getElementById("view").innerHTML = html;
        document.getElementById("btnSearch").addEventListener("click", function () {
          st.kw = document.getElementById("fKw").value.trim();
          draw();
        });
        document.getElementById("fKw").addEventListener("keydown", function (e) {
          if (e.key === "Enter") document.getElementById("btnSearch").click();
        });
        document.querySelectorAll("[data-abc]").forEach(function (b) {
          b.addEventListener("click", function () { st.abc = b.getAttribute("data-abc"); draw(); });
        });
        var nb = document.getElementById("mNew");
        if (nb) nb.addEventListener("click", newMaterial);
        var ab = document.getElementById("mAbc");
        if (ab) ab.addEventListener("click", function () {
          F.api("POST", "/api/materials/abc-recalc", {}).then(function (r) {
            F.toast("ABC 已重算：" + r.total + " 个物料，" + r.changed + " 个分类变化", "ok");
            draw();
          }).catch(function (e) { F.showErr(e); });
        });
        F.bindRows(document, function (code) { openMaterial(code); });
        F.setStatus("物料主数据 · " + d.total + " 项（A 类 " + (counts.A || 0) + " / B 类 " +

          "ABC 按年耗用金额（标准价 × 日均耗用 × 365）降序累计：<br>A ≤ 70% · B ≤ 90% · C 其余<br>" +
          "A 类重点管控库存与供应商，C 类可用较粗的补货策略。</div></div>" +
          '<div class="side-block"><div class="hd">补货参数</div><div class="bd small muted" style="line-height:1.9">' +

      });

    function newMaterial() {
      var body = '<div class="form-grid">' +
        '<label>物料名称 *</label><input id="nName" type="text">' +
        '<label>规格型号</label><input id="nSpec" type="text">' +
        '<label>单位</label><input id="nUnit" type="text" value="个">' +
        '<label>类别</label><select id="nCat">' + ["电子件", "结构件", "包材", "五金", "辅料", "设备件", "耗材", "其他"]
          .map(function (s) { return "<option>" + s + "</option>"; }).join("") + "</select>" +
        '<label>标准价（元）</label><input id="nPrice" type="number" step="0.01" value="0">' +
        '<label>采购提前期（天）</label><input id="nLead" type="number" value="10">' +
        '<label>安全库存</label><input id="nSafety" type="number" value="0">' +
        '<label>最大库存</label><input id="nMax" type="number" value="0">' +
        '<label>最小起订量</label><input id="nMoq" type="number" value="0">' +
        '<label>日均耗用</label><input id="nDaily" type="number" value="0">' +
        "</div>" +
        '<div class="small muted" id="dupHint" style="margin-top:8px"></div>';
      F.dialog("新建物料", body,
        '<button class="btn" data-close2="1">取消</button>' +
        '<button class="btn primary" id="nSave">保存</button>');
      var dlg = document.getElementById("dialog");
      dlg.querySelector("[data-close2]").addEventListener("click", F.closeDialog);
      var nameEl = document.getElementById("nName");
      var specEl = document.getElementById("nSpec");
      function checkDup() {
        if (!nameEl.value.trim() && !specEl.value.trim()) return;
        F.api("GET", "/api/materials/check-dup?" + F.qs({ name: nameEl.value.trim(), spec: specEl.value.trim() }))
          .then(function (r) {
            var hint = document.getElementById("dupHint");
            hint.innerHTML = (r.dups && r.dups.length)
              ? '<span class="up">疑似重复：' + r.dups.slice(0, 3).map(function (x) {
                return F.esc(x.name) + "（" + F.esc(x.code) + "，" + F.esc(x.reason) + "）"; }).join("；") + "</span>"
              : '<span class="down">未发现重复</span>';
          }).catch(function () {});
      }
      nameEl.addEventListener("blur", checkDup);
      specEl.addEventListener("blur", checkDup);
      document.getElementById("nSave").addEventListener("click", function () {
        var payload = {
          name: nameEl.value.trim(), spec: specEl.value.trim(), unit: document.getElementById("nUnit").value.trim(),
          category: document.getElementById("nCat").value,
          standardPrice: Number(document.getElementById("nPrice").value || 0),
          leadDays: Number(document.getElementById("nLead").value || 10),
          safetyStock: Number(document.getElementById("nSafety").value || 0),
          maxStock: Number(document.getElementById("nMax").value || 0),
          minOrderQty: Number(document.getElementById("nMoq").value || 0),
          avgDailyUsage: Number(document.getElementById("nDaily").value || 0)
        };
        F.api("POST", "/api/materials", payload).then(function (r) {
          F.closeDialog();
          F.toast("物料已创建：" + r.code, "ok");
          draw();
        }).catch(function (e) {
          if (e.status === 409 && e.body && e.body.dups) {
            if (window.confirm(e.message + "\n\n仍要新建吗？")) {
              payload.force = true;
              F.api("POST", "/api/materials", payload).then(function (r) {
                F.closeDialog(); F.toast("物料已创建：" + r.code, "ok"); draw();
              }).catch(function (e2) { F.showErr(e2); });
              return;
            }
          }
          F.showErr(e);
        });
      });
    }

    function openMaterial(code) {
      F.api("GET", "/api/materials/" + encodeURIComponent(code)).then(function (m) {
        var body = '<div class="detail-head"><div class="dh-title">' + F.esc(m.name) +
          ' <span class="mono small muted">' + F.esc(m.code) + "</span></div>" +
          '<div class="dh-tags">' + F.tag(m.abc, m.abc === "A" ? "green" : (m.abc === "B" ? "blue" : "gray")) +
          " " + F.tag(m.state || "正常") + "</div></div>" +
          '<div class="form-grid" style="margin-top:6px">' +
          "<div><span class='muted small'>规格</span><br>" + F.esc(m.spec) + "</div>" +
          "<div><span class='muted small'>单位 / 类别</span><br>" + F.esc(m.unit) + " / " + F.esc(m.category) + "</div>" +
          "<div><span class='muted small'>标准价 / 最近成交</span><br>" + F.money(m.standardPrice) + " / " + F.money(m.lastPrice) + "</div>" +
          "<div><span class='muted small'>现存量 / 安全库存</span><br>" + F.qty(m.onHand) + " / " + F.qty(m.safetyStock) + "</div>" +
          "<div><span class='muted small'>补货点 / 覆盖天数</span><br>" + F.qty(m.reorderPoint) + " / " +
          (m.coverageDays === null ? "—" : F.qty(m.coverageDays)) + "</div>" +
          "<div><span class='muted small'>提前期 / 主供</span><br>" + m.leadDays + " 天 / " + F.esc(m.mainSupplier || "—") + "</div>" +
          "</div>" +
          '<div class="section-title" style="margin-top:12px">价格记录</div>' +
          F.table([{ label: "生效日", key: "effective_at" },
            { label: "供应商", render: function (r) { return F.esc(r.supplier_code || "—"); } },
            { label: "价格", num: true, render: function (r) { return F.money(r.price); } },
            { label: "来源", render: function (r) { return F.tag(r.source, "gray"); } },
            { label: "备注", render: function (r) { return '<span class="small muted">' + F.esc(r.remark || "—") + "</span>"; } }],
            m.prices, { empty: "暂无价格记录" }) +
          '<div class="section-title" style="margin-top:12px">分仓库存</div>' +
          F.table([{ label: "仓库", key: "warehouse" }, { label: "批次", key: "batch" },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "成本", num: true, render: function (r) { return F.money(r.unit_cost); } },
            { label: "入库日", key: "in_date" }, { label: "有效期", render: function (r) { return F.esc(r.expire_at || "—"); } }],
            m.stock, { empty: "暂无库存" }) +
          '<div class="section-title" style="margin-top:12px">最近出入库</div>' +
          F.table([{ label: "时间", render: function (r) { return '<span class="small muted">' + F.esc(r.created_at) + "</span>"; } },
            { label: "类型", render: function (r) { return F.tag(r.type); } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "仓库", key: "warehouse" }, { label: "来源单", key: "ref_no" }],
            m.moves, { empty: "暂无流水" });
        F.dialog("物料详情 · " + m.name, body, '<button class="btn" data-close3="1">关闭</button>');
        var dlg = document.getElementById("dialog");
        dlg.querySelector("[data-close3]").addEventListener("click", F.closeDialog);
      }).catch(function (e) { F.showErr(e); });
    }
    F.openMaterial = openMaterial;
    draw();
  });
})(window, document);

</script>
<script>
/* 飞泉 SCM · 请购、询价比价、采购订单、收货质检 */
(function (window, document) {
  "use strict";
  var F = window.F;

  var cache = { mats: null, sups: null, whs: null };
  function mats() {
    if (cache.mats) return Promise.resolve(cache.mats);
    return F.api("GET", "/api/materials").then(function (d) { cache.mats = d.list; return d.list; });
  }
  function sups() {
    if (cache.sups) return Promise.resolve(cache.sups);
    return F.api("GET", "/api/suppliers").then(function (d) { cache.sups = d.list; return d.list; });
  }
  function whs() {
    if (cache.whs) return Promise.resolve(cache.whs);
    return F.api("GET", "/api/warehouses").then(function (d) { cache.whs = d; return d; });
  }
  F.mdmCache = cache;

  /* ============================================================ 请购单 */
  F.register("requisitions", function () {
    var st = { status: "全部", kw: "" };

    function draw() {
      F.api("GET", "/api/requisitions?" + F.qs({ status: st.status, kw: st.kw })).then(function (d) {
        var counts = { "全部": d.total };
        d.list.forEach(function (r) { counts[r.status] = (counts[r.status] || 0) + 1; });
        var chips = ["全部", "草稿", "待审批", "已审批", "已转单", "已驳回"].map(function (s) {
          return '<button class="chip ' + (st.status === s ? "on" : "") + '" data-st="' + s + '">' + s +
            "<b>" + (counts[s] || 0) + "</b></button>";
        }).join("");
        var html = '<div class="panel"><div class="panel-title">请购单' +
          '<span class="panel-actions"><input id="fKw" type="text" placeholder="单号 / 用途 / 部门" value="' +
          F.esc(st.kw) + '" style="width:180px">' +
          '<button class="btn sm" id="btnSearch">查询</button>' +
          (F.canWrite() ? '<button class="btn sm primary" id="rNew">+ 新建请购</button>' : "") +
          "</span></div>" +
          '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
          '<div class="panel-body flush">' +
          F.table([
            { label: "单号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "部门 / 用途", render: function (r) { return F.esc(r.dept) + ' <span class="muted small">' +
              F.esc(r.purpose) + "</span>"; } },
            { label: "需求日期", key: "needDate" },
            { label: "明细", num: true, render: function (r) { return r.itemCount + " 行"; } },
            { label: "金额", num: true, render: function (r) { return F.money(r.amount); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "申请人", render: function (r) { return F.esc(r.applicantName || r.applicant); } },
            { label: "转单", render: function (r) { return r.convertedNo
              ? '<span class="mono small">' + F.esc(r.convertedNo) + "</span>" : "—"; } }
          ], d.list, { click: function (r) { return r.no; }, empty: "没有匹配的请购单" }) +
          "</div></div>";
        document.getElementById("view").innerHTML = html;
        document.getElementById("btnSearch").addEventListener("click", function () {
          st.kw = document.getElementById("fKw").value.trim(); draw();
        });
        document.getElementById("fKw").addEventListener("keydown", function (e) {
          if (e.key === "Enter") document.getElementById("btnSearch").click();
        });
        document.querySelectorAll("[data-st]").forEach(function (b) {
          b.addEventListener("click", function () { st.status = b.getAttribute("data-st"); draw(); });
        });
        var nb = document.getElementById("rNew");
        if (nb) nb.addEventListener("click", newReq);
        F.bindRows(document, openReq);
        F.setStatus("请购单 · " + d.total + " 张（待审批 " + (counts["待审批"] || 0) + "）");
        F.setSide('<div class="side-block"><div class="hd">流程</div><div class="bd small muted" style="line-height:1.9">' +
          "草稿 → 待审批 → 已审批 → 转采购订单 / 发起询价<br>" +
          "低于「请购免审批金额」的请购由总监提交时自动通过；批准时校验部门季度预算。</div></div>");
      });
    }

    function newReq() {
      mats().then(function (list) {
        var opts = list.map(function (m) {
          return '<option value="' + F.esc(m.code) + '">' + F.esc(m.code + " " + m.name + "（" + m.unit + "）") + "</option>";
        }).join("");
        var body = '<div class="form-grid">' +
          '<label>需求部门</label><select id="nDept">' + ["计划部", "生产部", "研发部", "仓储部"]
            .map(function (s) { return "<option>" + s + "</option>"; }).join("") + "</select>" +
          '<label>需求日期</label><input id="nNeed" type="date" value="' + F.addDays(14) + '">' +
          '<label>用途</label><input id="nPurpose" type="text" value="Q4 量产备料">' +
          '<label>备注</label><input id="nRemark" type="text">' +
          "</div>" +
          '<div class="section-title" style="margin-top:10px">明细</div>' +
          '<div id="lines"></div><button class="btn sm" id="addLine" style="margin-top:8px">+ 增加一行</button>';
        F.dialog("新建请购", body,
          '<button class="btn" data-close2="1">取消</button><button class="btn primary" id="nSave">保存草稿</button>');
        var dlg = document.getElementById("dialog");
        dlg.querySelector("[data-close2]").addEventListener("click", F.closeDialog);
        var idx = 0;
        function addLine() {
          idx += 1;
          var row = document.createElement("div");
          row.className = "form-row";
          row.style.cssText = "display:flex;gap:8px;margin-bottom:6px";
          row.innerHTML = '<select class="lnMat" style="flex:1">' + opts + "</select>" +
            '<input class="lnQty" type="number" placeholder="数量" style="width:110px" value="100">' +
            '<input class="lnPrice" type="number" step="0.01" placeholder="估价" style="width:110px">';
          document.getElementById("lines").appendChild(row);
          var sel = row.querySelector(".lnMat");
          sel.addEventListener("change", function () {
            var m = list.filter(function (x) { return x.code === sel.value; })[0];
            if (m) row.querySelector(".lnPrice").value = m.standardPrice;
          });
          var first = list[0];
          if (first) { sel.value = first.code; row.querySelector(".lnPrice").value = first.standardPrice; }
        }
        addLine();
        document.getElementById("addLine").addEventListener("click", addLine);
        document.getElementById("nSave").addEventListener("click", function () {
          var items = [];
          document.querySelectorAll("#lines .form-row").forEach(function (row) {
            var code = row.querySelector(".lnMat").value;
            var qty = Number(row.querySelector(".lnQty").value || 0);
            if (code && qty > 0) {
              items.push({ materialCode: code, qty: qty,
                estPrice: Number(row.querySelector(".lnPrice").value || 0) });
            }
          });
          if (!items.length) { F.toast("请至少填写一行有效明细", "err"); return; }
          F.api("POST", "/api/requisitions", {
            dept: document.getElementById("nDept").value,
            needDate: document.getElementById("nNeed").value,
            purpose: document.getElementById("nPurpose").value.trim(),
            remark: document.getElementById("nRemark").value.trim(),
            items: items
          }).then(function (r) {
            F.closeDialog();
            F.toast("请购已创建：" + r.no + "（" + F.money(r.amount) + "）", "ok");
            draw();
          }).catch(function (e) { F.showErr(e); });
        });
      });
    }

    function openReq(no) {
      F.api("GET", "/api/requisitions/" + encodeURIComponent(no)).then(function (r) {
        var body = '<div class="detail-head"><div class="dh-title">' + F.esc(r.no) + " " + F.esc(r.purpose) +
          '</div><div class="dh-tags">' + F.tag(r.status) + "</div></div>" +
          '<div class="form-grid" style="margin-top:6px">' +
          "<div><span class='muted small'>部门</span><br>" + F.esc(r.dept) + "</div>" +
          "<div><span class='muted small'>申请人</span><br>" + F.esc(r.applicantName || r.applicant) + "</div>" +
          "<div><span class='muted small'>需求日期</span><br>" + F.esc(r.needDate) + "</div>" +
          "<div><span class='muted small'>金额</span><br>" + F.money(r.amount) + "</div>" +
          "<div><span class='muted small'>审批人</span><br>" + F.esc(r.approverName || "—") + "</div>" +
          "<div><span class='muted small'>关联单据</span><br>" + F.esc(r.convertedNo || "—") + "</div>" +
          "</div>" + (r.rejectReason ? '<div class="warn-box" style="margin-top:8px">驳回原因：' +
            F.esc(r.rejectReason) + "</div>" : "") +
          '<div class="section-title" style="margin-top:10px">明细</div>' +
          F.table([
            { label: "物料", render: function (x) { return F.esc(x.materialCode) + " " + F.esc(x.materialName); } },
            { label: "规格", render: function (x) { return '<span class="small muted">' + F.esc(x.spec) + "</span>"; } },
            { label: "数量", num: true, render: function (x) { return F.qty(x.qty) + " " + F.esc(x.unit); } },
            { label: "估价", num: true, render: function (x) { return F.money(x.estPrice); } },
            { label: "金额", num: true, render: function (x) { return F.money(x.amount); } }
          ], r.items);
        var acts = [];
        if (r.status === "草稿") acts.push('<button class="btn primary" id="aSubmit">提交审批</button>');
        if (r.status === "待审批" && F.canApprove()) {
          acts.push('<button class="btn primary" id="aApprove">批准</button>');
          acts.push('<button class="btn" id="aReject">驳回</button>');
        }
        if (r.status === "已审批") {
          acts.push('<button class="btn primary" id="aToPo">转采购订单</button>');
          acts.push('<button class="btn" id="aToRfq">发起询价</button>');
        }
        if (["草稿", "待审批", "已审批"].indexOf(r.status) >= 0) {
          acts.push('<button class="btn" id="aCancel">取消请购</button>');
        }
        F.dialog("请购单 " + r.no, body, acts.join("") + '<button class="btn" data-close3="1">关闭</button>');
        var dlg = document.getElementById("dialog");
        dlg.querySelector("[data-close3]").addEventListener("click", F.closeDialog);

        function act(id, fn) { var b = document.getElementById(id); if (b) b.addEventListener("click", fn); }
        act("aSubmit", function () {
          F.api("POST", "/api/requisitions/" + r.no + "/submit", {}).then(function (x) {
            F.closeDialog();
            F.toast(x.auto ? "已自动通过（低于免审批金额）" : "已提交，等待审批", "ok");
            draw();
          }).catch(function (e) { F.showErr(e); });
        });
        act("aApprove", function () {
          F.api("POST", "/api/requisitions/" + r.no + "/approve", {}).then(function () {
            F.closeDialog(); F.toast("已批准：" + r.no, "ok"); draw();
          }).catch(function (e) { F.showErr(e); });
        });
        act("aReject", function () {
          var why = window.prompt("驳回原因（至少 2 个字）", "预算不足，改为分批发起");
          if (why === null) return;
          F.api("POST", "/api/requisitions/" + r.no + "/reject", { reason: why }).then(function () {
            F.closeDialog(); F.toast("已驳回", "ok"); draw();
          }).catch(function (e) { F.showErr(e); });
        });
        act("aCancel", function () {
          F.api("POST", "/api/requisitions/" + r.no + "/cancel", {}).then(function () {
            F.closeDialog(); F.toast("已取消", "ok"); draw();
          }).catch(function (e) { F.showErr(e); });
        });
        act("aToPo", function () { toPo(r); });
        act("aToRfq", function () { toRfq(r); });
      }).catch(function (e) { F.showErr(e); });
    }

    function toPo(r) {
      sups().then(function (list) {
        var ok = list.filter(function (s) { return s.status === "已准入"; });
        if (!ok.length) { F.toast("没有已准入的供应商，请先完成准入", "err"); return; }
        var body = '<div class="form-grid"><label>供应商 *</label><select id="pSup">' +
          ok.map(function (s) {
            return '<option value="' + s.code + '">' + F.esc(s.name + "（" + s.level + " 级 · 账期 " +
              s.paymentTerms + " 天）") + "</option>";
          }).join("") + "</select>" +
          '<label>承诺到货</label><input id="pPromise" type="date" value="' + F.addDays(20) + '">' +
          '<label>价格口径</label><select id="pMode"><option value="est">按请购估价</option>' +
          '<option value="standard">按物料标准价</option></select></div>' +
          '<div class="small muted" style="margin-top:8px">转单后生成采购订单草稿，需再提交审批才能下单。</div>';
        F.dialog("转采购订单", body,
          '<button class="btn" data-close4="1">取消</button><button class="btn primary" id="pSave">生成订单</button>');
        var dlg = document.getElementById("dialog");
        dlg.querySelector("[data-close4]").addEventListener("click", F.closeDialog);
        document.getElementById("pSave").addEventListener("click", function () {
          F.api("POST", "/api/requisitions/" + r.no + "/to-order", {
            supplierCode: document.getElementById("pSup").value,
            promiseDate: document.getElementById("pPromise").value,
            priceMode: document.getElementById("pMode").value
          }).then(function (x) {
            F.closeDialog();
            F.toast("已生成采购订单：" + x.poNo, "ok");
            draw();
            F.go("orders");
          }).catch(function (e) { F.showErr(e); });
        });
      });
    }

    function toRfq(r) {
      sups().then(function (list) {
        var ok = list.filter(function (s) { return s.status === "已准入"; });
        var body = '<div class="small muted" style="margin-bottom:8px">勾选参与询价的供应商（至少 2 家）</div>' +
          ok.map(function (s, i) {
            return '<label style="display:block;margin-bottom:4px"><input type="checkbox" class="rfqSup" value="' +
              F.esc(s.code) + '"' + (i < 3 ? " checked" : "") + "> " + F.esc(s.name) + "（" +
              s.level + " 级）</label>";
          }).join("") +
          '<div class="form-grid" style="margin-top:8px"><label>报价截止</label>' +
          '<input id="rfqDeadline" type="date" value="' + F.addDays(7) + '"></div>';
        F.dialog("发起询价", body,
          '<button class="btn" data-close5="1">取消</button><button class="btn primary" id="rfqSave">创建询价单</button>');
        var dlg = document.getElementById("dialog");
        dlg.querySelector("[data-close5]").addEventListener("click", F.closeDialog);
        document.getElementById("rfqSave").addEventListener("click", function () {
          var codes = [];
          document.querySelectorAll(".rfqSup").forEach(function (cb) {
            if (cb.checked) codes.push(cb.value);
          });
          F.api("POST", "/api/requisitions/" + r.no + "/to-rfq", {
            supplierCodes: codes, deadline: document.getElementById("rfqDeadline").value
          }).then(function (x) {
            F.closeDialog();
            F.toast("询价单已创建：" + x.rfqNo, "ok");
            F.go("rfqs");
          }).catch(function (e) { F.showErr(e); });
        });
      });
    }
    F.openReq = openReq;
    draw();
  });

  /* ============================================================ 询价比价 */
  F.register("rfqs", function () {
    function draw() {
      F.api("GET", "/api/rfqs").then(function (d) {
        var html = '<div class="panel"><div class="panel-title">询价比价' +
          '<span class="panel-actions small muted">报价家数不足 ' +
          ((F.state.boot.rules || []).filter(function (r) { return r.code === "rfq_min_suppliers"; })[0] || {}).value +
          " 家不允许定标</span></div><div class='panel-body flush'>" +
          F.table([
            { label: "询价单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "标题", render: function (r) { return F.esc(r.title) +
              '<div class="muted small">请购 ' + F.esc(r.reqNo || "—") + "</div>"; } },
            { label: "报价家数", num: true, render: function (r) { return r.quoteCount; } },
            { label: "最低报价", num: true, render: function (r) { return r.bestAmount ? F.money(r.bestAmount) : "—"; } },
            { label: "价差", num: true, render: function (r) { return r.spread ? F.money(r.spread) : "—"; } },
            { label: "定标", render: function (r) { return r.awardedSupplier
              ? F.esc(r.awardedSupplier) + '<div class="muted small">' + F.money(r.awardedAmount) + "</div>" : "—"; } },
            { label: "截止", key: "deadline" },
            { label: "状态", render: function (r) { return F.tag(r.status); } }
          ], d.list, { click: function (r) { return r.no; }, empty: "暂无询价单（可从请购单发起）" }) +
          "</div></div>";
        document.getElementById("view").innerHTML = html;
        F.bindRows(document, openRfq);
        F.setStatus("询价比价 · " + d.total + " 张");
        F.setSide('<div class="side-block"><div class="hd">比价口径</div><div class="bd small muted" style="line-height:1.9">' +
          "· 定标前至少 2 家有效报价<br>· 定标后自动按标准价占比分摊生成采购订单<br>" +
          "· 报价含税到厂价，价格指数 = 成交价 ÷ 市场均价</div></div>");
      });
    }

    function openRfq(no) {
      F.api("GET", "/api/rfqs/" + encodeURIComponent(no)).then(function (r) {
        var min = r.minSuppliers || 2;
        var body = '<div class="detail-head"><div class="dh-title">' + F.esc(r.no) + " " + F.esc(r.title) +
          '</div><div class="dh-tags">' + F.tag(r.status) + "</div></div>" +
          '<div class="form-grid" style="margin-top:6px">' +
          "<div><span class='muted small'>关联请购</span><br>" + F.esc(r.reqNo || "—") + "</div>" +
          "<div><span class='muted small'>报价截止</span><br>" + F.esc(r.deadline) + "</div>" +
          "<div><span class='muted small'>采购员</span><br>" + F.esc(r.ownerName || r.owner) + "</div>" +
          "<div><span class='muted small'>最少报价家数</span><br>" + min + " 家</div></div>" +
          '<div class="section-title" style="margin-top:10px">询价明细</div>' +
          F.table([{ label: "物料", render: function (x) { return F.esc(x.materialCode) + " " + F.esc(x.materialName); } },

              return '<option value="' + F.esc(s.code) + '">' + F.esc(s.name + "（" + s.level + " 级）") + "</option>";

            var d2 = document.getElementById("dialog");

            var opts = r.quotes.map(function (q, i) {
              return '<option value="' + F.esc(q.supplierCode) + '"' + (i === 0 ? " selected" : "") + ">" +

              "</select></div><div class='small muted' style='margin-top:8px'>定标后自动生成采购订单草稿。</div>",
              '<button class="btn" data-close5="1">取消</button><button class="btn primary" id="aSave">确认定标</button>');
            var d3 = document.getElementById("dialog");
            d3.querySelector("[data-close5]").addEventListener("click", F.closeDialog);
            document.getElementById("aSave").addEventListener("click", function () {
              F.api("POST", "/api/rfqs/" + r.no + "/award", { supplierCode: document.getElementById("aSup").value })
                .then(function (x) {
                  F.closeDialog();
                  F.toast("已定标：" + x.supplier + "，生成订单 " + x.poNo, "ok");

                  F.go("orders");

            });
          });
        }
      }).catch(function (e) { F.showErr(e); });
