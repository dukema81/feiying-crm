          '<div class="kpi gold"><div class="k-label">出库数量合计</div><div class="k-value">' +
          F.qty(d.outQty) + "</div><div class='k-sub'>含领用 / 调拨 / 盘亏</div></div>" +
          '<div class="kpi"><div class="k-label">净变动</div><div class="k-value">' +
          F.qty(d.inQty - d.outQty) + "</div><div class='k-sub'>按数量口径</div></div></div>" +
          '<div class="chips" style="margin-bottom:10px">' +
          ["全部"].concat(d.types).map(function (t) {
            return '<button class="chip ' + (st.type === t ? "on" : "") + '" data-type="' + t + '">' +
              t + "</button>";
          }).join("") + "</div>" +
          '<div style="display:flex;gap:8px;margin-bottom:8px">' +
          '<input id="mKw" type="text" placeholder="物料 / 单号" value="' + F.esc(st.kw) +
          '" style="width:200px"><button class="btn sm" id="mSearch">查询</button>' +
          '<span class="small muted" style="align-self:center">共 ' + d.total +
          " 笔，显示最近 60 笔</span></div>" +
          '<div style="margin:0 -14px -14px">' + F.table([
            { label: "时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.created_at) + "</span>"; } },
            { label: "流水号", render: function (r) { return '<span class="mono small">' +
              F.esc(r.no) + "</span>"; } },
            { label: "类型", render: function (r) { return F.tag(r.type); } },
            { label: "物料", render: function (r) { return F.esc(r.material_name) +
              '<div class="muted small mono">' + F.esc(r.material_code) + "</div>"; } },
            { label: "仓库", key: "warehouse" },
            { label: "批次", render: function (r) { return '<span class="mono small">' +
              F.esc(r.batch || "—") + "</span>"; } },
            { label: "数量", num: true, render: function (r) {
              var out = /出库|盘亏/.test(r.type);
              return '<b class="' + (out ? "down" : "up") + '">' + (out ? "−" : "+") + F.qty(r.qty) + "</b>";
            } },
            { label: "金额", num: true, render: function (r) { return F.money(r.cost); } },
            { label: "来源单据", render: function (r) { return r.ref_no
              ? '<span class="mono small">' + F.esc(r.ref_no) + "</span>" : "—"; } },
            { label: "原因", render: function (r) { return '<span class="small muted">' +
              F.esc(r.reason || "—") + "</span>"; } },
            { label: "操作员", render: function (r) { return F.esc(r.operator || "—"); } }
          ], d.list.slice(0, 60), { empty: "暂无流水" }) + "</div>";
        document.getElementById("mSearch").addEventListener("click", function () {
          st.kw = document.getElementById("mKw").value.trim(); draw();
        });
        document.querySelectorAll("[data-type]").forEach(function (b) {
          b.addEventListener("click", function () { st.type = b.getAttribute("data-type"); draw(); });
        });
        F.setStatus("出入库流水 · " + d.total + " 笔");
        F.setSide('<div class="side-block"><div class="hd">流水口径</div><div class="bd small muted" ' +
          'style="line-height:1.9">采购入库来自收货质检过账；领用出库、盘盈盘亏由库存作业与盘点生成；' +
          "调拨会同时写入调出仓与调入仓两条流水，方向以类型的「出库 / 入库」判定。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    function drawTransfers() {
      F.api("GET", "/api/transfers").then(function (d) {
        var box = document.getElementById("opsBody");
        box.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;' +
          'margin-bottom:8px"><div class="small muted">调拨单共 ' + d.total + " 张</div>" +
          (canStock() ? '<button class="btn sm primary" id="tNew">+ 新建调拨</button>' : "") + "</div>" +
          '<div style="margin:0 -14px -14px">' + F.table([
            { label: "单号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "调出 → 调入", render: function (r) {
              return F.esc(r.fromWh) + ' <span class="muted">→</span> ' + F.esc(r.toWh);
            } },
            { label: "明细", num: true, render: function (r) { return r.itemCount + " 行"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "申请人", render: function (r) { return F.esc(r.applicant || "—"); } },
            { label: "审批人", render: function (r) { return F.esc(r.approver || "—"); } },
            { label: "创建时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.createdAt) + "</span>"; } },
            { label: "操作", render: function (r) {
              if (!canStock()) return "—";
              var btn = [];
              if (r.status === "草稿") btn.push('<button class="btn xs" data-ap="' + F.esc(r.no) + '">审批</button>');
              if (r.status === "已审批") btn.push('<button class="btn xs primary" data-post="' +
                F.esc(r.no) + '">执行调拨</button>');
              return btn.join(" ") || "—";
            } }
          ], d.list, { click: function (r) { return r.no; }, empty: "暂无调拨单" }) + "</div>";
        var nb = document.getElementById("tNew");
        if (nb) nb.addEventListener("click", newTransfer);
        F.bindRows(document, function (no) { openTransfer(no, d.list); });
        document.querySelectorAll("[data-ap]").forEach(function (b) {
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            F.api("POST", "/api/transfers/" + encodeURIComponent(b.getAttribute("data-ap")) + "/approve", {})
              .then(function () { F.toast("调拨单已审批", "ok"); draw(); })
              .catch(function (e) { F.showErr(e); });
          });
        });
        document.querySelectorAll("[data-post]").forEach(function (b) {
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            if (!window.confirm("执行调拨将立即扣减调出仓库存并增加调入仓库存，确认执行？")) return;
            F.api("POST", "/api/transfers/" + encodeURIComponent(b.getAttribute("data-post")) + "/post", {})
              .then(function () { F.toast("调拨已执行，库存已过账", "ok"); draw(); })
              .catch(function (e) { F.showErr(e); });
          });
        });
        F.setStatus("仓间调拨 · " + d.total + " 张");
        F.setSide('<div class="side-block"><div class="hd">调拨流程</div><div class="bd small muted" ' +
          'style="line-height:1.9">草稿 → 已审批 → 已完成<br>仓管 / 管理员新建时直接进入已审批；' +
          "执行时逐行校验调出仓库存，任一不足则整单失败、不做部分过账。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    function newTransfer() {
      F.api("GET", "/api/materials").then(function (md) {
        var opts = md.list.map(function (m) {
          return '<option value="' + F.esc(m.code) + '">' + F.esc(m.code + " " + m.name) + "</option>";
        }).join("");
        F.dialog("新建调拨单", '<div class="form-grid">' +
          '<label>调出仓</label><select id="tFrom">' + whOptions("", false) + "</select>" +
          '<label>调入仓</label><select id="tTo">' + whOptions("", false) + "</select>" +
          '<label>备注</label><input id="tRemark" type="text" placeholder="如：生产备料移库"></div>' +
          '<div class="section-title" style="margin-top:10px">调拨明细</div><div id="tLines"></div>' +
          '<button class="btn sm" id="tAdd" style="margin-top:8px">+ 增加一行</button>',
          '<button class="btn" data-close2="1">取消</button>' +
          '<button class="btn primary" id="tSave">保存</button>');
        document.getElementById("dialog").querySelector("[data-close2]")
          .addEventListener("click", F.closeDialog);
        function addLine() {
          var row = document.createElement("div");
          row.className = "t-line";
          row.style.cssText = "display:flex;gap:8px;margin-bottom:6px";
          row.innerHTML = '<select class="tlMat" style="flex:1">' + opts + "</select>" +
            '<input class="tlQty" type="number" value="10" style="width:120px">';
          document.getElementById("tLines").appendChild(row);
        }
        addLine();
        document.getElementById("tAdd").addEventListener("click", addLine);
        document.getElementById("tSave").addEventListener("click", function () {
          var items = [];
          document.querySelectorAll("#tLines .t-line").forEach(function (row) {
            var code = row.querySelector(".tlMat").value;
            var qty = Number(row.querySelector(".tlQty").value || 0);
            if (code && qty > 0) items.push({ materialCode: code, qty: qty });
          });
          F.api("POST", "/api/transfers", {
            fromWh: document.getElementById("tFrom").value,
            toWh: document.getElementById("tTo").value,
            remark: document.getElementById("tRemark").value.trim(),
            items: items
          }).then(function (r) {
            F.closeDialog();
            F.toast("调拨单已创建：" + r.no + "（" + r.status + "）", "ok");
            draw();
          }).catch(function (e) { F.showErr(e); });
        });
      });
    }

    function openTransfer(no, list) {
      var r = list.filter(function (x) { return x.no === no; })[0];
      if (!r) return;
      F.dialog("调拨单 " + no, '<div class="detail-head"><div class="dh-title">' + F.esc(r.fromWh) +
        ' → ' + F.esc(r.toWh) + '</div><div class="dh-tags">' + F.tag(r.status) + "</div></div>" +
        '<div class="form-grid" style="grid-template-columns:110px 1fr 110px 1fr;margin-bottom:10px">' +
        '<label>申请人</label><div>' + F.esc(r.applicant || "—") + "</div>" +
        '<label>审批人</label><div>' + F.esc(r.approver || "—") + "</div>" +
        '<label>备注</label><div>' + F.esc(r.remark || "—") + "</div>" +
        '<label>创建时间</label><div class="small muted">' + F.esc(r.createdAt) + "</div></div>" +
        F.table([
          { label: "物料", render: function (i) { return F.esc(i.materialName) +
            '<div class="muted small mono">' + F.esc(i.materialCode) + "</div>"; } },
          { label: "数量", num: true, render: function (i) { return F.qty(i.qty) + " " + F.esc(i.unit); } }
        ], r.items || [], { empty: "无明细" }),
        '<button class="btn" data-close2="1">关闭</button>');
      document.getElementById("dialog").querySelector("[data-close2]")
        .addEventListener("click", F.closeDialog);
    }

    function drawStocktakes() {
      F.api("GET", "/api/stocktakes").then(function (d) {
        var box = document.getElementById("opsBody");
        box.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;' +
          'margin-bottom:8px"><div class="small muted">盘点单共 ' + d.total + " 张</div>" +
          (canStock() ? '<button class="btn sm primary" id="kNew">+ 发起盘点</button>' : "") + "</div>" +
          '<div style="margin:0 -14px -14px">' + F.table([
            { label: "单号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "仓库", key: "warehouse" },
            { label: "明细", num: true, render: function (r) { return r.itemCount + " 行"; } },
            { label: "差异行", num: true, render: function (r) {
              return r.diffCount ? '<b class="up">' + r.diffCount + "</b>" : "0";
            } },
            { label: "差异金额", num: true, render: function (r) {
              return r.diffAmount ? '<b class="' + (r.diffAmount > 0 ? "up" : "down") + '">' +
                F.money(r.diffAmount) + "</b>" : "0.00";
            } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "发起人", render: function (r) { return F.esc(r.applicant || "—"); } },
            { label: "完成人", render: function (r) { return F.esc(r.approver || "—"); } },
            { label: "操作", render: function (r) {
              if (!canStock() || r.status === "已完成") return "—";
              return '<button class="btn xs primary" data-finish="' + F.esc(r.no) + '">录入实盘</button>';
            } }
          ], d.list, { click: function (r) { return r.no; }, empty: "暂无盘点单" }) + "</div>";
        var nb = document.getElementById("kNew");
        if (nb) nb.addEventListener("click", newStocktake);
        F.bindRows(document, function (no) { openStocktake(no, d.list); });
        document.querySelectorAll("[data-finish]").forEach(function (b) {
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            var no = b.getAttribute("data-finish");
            finishStocktake(no, d.list.filter(function (x) { return x.no === no; })[0]);
          });
        });
        F.setStatus("库存盘点 · " + d.total + " 张");
        F.setSide('<div class="side-block"><div class="hd">盘点口径</div><div class="bd small muted" ' +
          'style="line-height:1.9">发起盘点即按所选仓库快照全部批次账面数量；录入实盘后差异不为 0 的行' +
          "会写盘盈 / 盘亏流水并直接调整库存，差异金额同步记入盘点单。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    function newStocktake() {
      F.dialog("发起盘点", '<div class="form-grid">' +
        '<label>盘点仓库</label><select id="kWh">' + whOptions("", false) + "</select>" +
        '<label>备注</label><input id="kRemark" type="text" placeholder="如：Q4 季度全盘"></div>' +
        '<div class="small muted" style="margin-top:8px">发起后按该仓库现有库存批次生成盘点行。</div>',
        '<button class="btn" data-close2="1">取消</button>' +
        '<button class="btn primary" id="kSave">发起盘点</button>');
      document.getElementById("dialog").querySelector("[data-close2]")
        .addEventListener("click", F.closeDialog);
      document.getElementById("kSave").addEventListener("click", function () {
        F.api("POST", "/api/stocktakes", {
          warehouse: document.getElementById("kWh").value,
          remark: document.getElementById("kRemark").value.trim()
        }).then(function (r) {
          F.closeDialog();
          F.toast("盘点单已发起：" + r.no + "（" + r.lines + " 行）", "ok");
          draw();
        }).catch(function (e) { F.showErr(e); });
      });
    }

    function openStocktake(no, list) {
      var r = list.filter(function (x) { return x.no === no; })[0];
      if (!r) return;
      F.dialog("盘点单 " + no, '<div class="detail-head"><div class="dh-title">' + F.esc(r.warehouse) +
        '</div><div class="dh-tags">' + F.tag(r.status) + '<span class="tag gray">差异 ' +
        F.money(r.diffAmount) + "</span></div></div>" +
        F.table([
          { label: "物料", render: function (i) { return F.esc(i.materialName) +
            '<div class="muted small mono">' + F.esc(i.materialCode) + "</div>"; } },
          { label: "批次", render: function (i) { return '<span class="mono small">' +
            F.esc(i.batch || "—") + "</span>"; } },
          { label: "账面", num: true, render: function (i) { return F.qty(i.bookQty); } },
          { label: "实盘", num: true, render: function (i) { return F.qty(i.realQty); } },
          { label: "差异", num: true, render: function (i) {
            return i.diffQty ? '<b class="' + (i.diffQty > 0 ? "up" : "down") + '">' +
              F.qty(i.diffQty) + "</b>" : "0";
          } },
          { label: "差异金额", num: true, render: function (i) { return F.money(i.cost * i.diffQty); } }
        ], r.items || [], { empty: "无盘点行" }),
        '<button class="btn" data-close2="1">关闭</button>');
      document.getElementById("dialog").querySelector("[data-close2]")
        .addEventListener("click", F.closeDialog);
    }

    function finishStocktake(no, r) {
      if (!r) return;
      var rowsHtml = (r.items || []).map(function (i, idx) {
        return "<tr><td>" + F.esc(i.materialName) + '<div class="muted small mono">' + F.esc(i.materialCode) +
          '</div></td><td class="mono small">' + F.esc(i.batch || "—") + '</td><td class="num">' +
          F.qty(i.bookQty) + '</td><td><input type="number" class="kv-real" data-i="' + idx +
          '" value="' + i.bookQty + '" style="width:110px"></td><td class="num kv-diff" data-i="' + idx +
          '">0</td></tr>';
      }).join("");
      F.dialog("录入实盘 · " + no, '<div class="small muted" style="margin-bottom:8px">' +
        "修改实盘数量后提交，差异行会自动写盘盈 / 盘亏流水。</div>" +
        "<table class='grid-table'><thead><tr><th>物料</th><th>批次</th><th class='num'>账面</th>" +
        "<th>实盘</th><th class='num'>差异</th></tr></thead><tbody>" + rowsHtml + "</tbody></table>",
        '<button class="btn" data-close2="1">取消</button>' +
        '<button class="btn primary" id="kFinish">完成盘点</button>');
      document.getElementById("dialog").querySelector("[data-close2]")
        .addEventListener("click", F.closeDialog);
      document.querySelectorAll("#dialog .kv-real").forEach(function (inp) {
        inp.addEventListener("input", function () {
          var i = Number(inp.getAttribute("data-i"));
          var it = r.items[i];
          var diff = Number(inp.value || 0) - Number(it.bookQty || 0);
          var cell = document.querySelector('#dialog .kv-diff[data-i="' + i + '"]');
          cell.textContent = diff === 0 ? "0" : (diff > 0 ? "+" : "") + F.qty(diff);
          cell.className = "num kv-diff " + (diff > 0 ? "up" : diff < 0 ? "down" : "");
        });
      });
      document.getElementById("kFinish").addEventListener("click", function () {
        var items = [];
        document.querySelectorAll("#dialog .kv-real").forEach(function (inp) {
          var i = Number(inp.getAttribute("data-i"));
          items.push({ materialCode: r.items[i].materialCode, batch: r.items[i].batch,
            realQty: Number(inp.value || 0) });
        });
        F.api("POST", "/api/stocktakes/" + encodeURIComponent(no) + "/finish", { items: items })
          .then(function (res) {
            F.closeDialog();
            F.toast("盘点已完成，差异金额 " + F.money(res.diffAmount), "ok");
            draw();
          }).catch(function (e) { F.showErr(e); });
      });
    }

    function drawAdjust() {
      var code = (F.state.params && F.state.params.code) || "";
      F.api("GET", "/api/materials").then(function (md) {
        var opts = md.list.map(function (m) {
          return '<option value="' + F.esc(m.code) + '"' + (m.code === code ? " selected" : "") + ">" +
            F.esc(m.code + " " + m.name + "（" + m.unit + "）") + "</option>";
        }).join("");
        var box = document.getElementById("opsBody");
        if (!canStock()) {
          box.innerHTML = '<div class="warn-box">当前角色（' + F.esc(me().role_label || me().role) +
            "）没有库存作业权限，库存调整需仓管 / 质检 / 管理员角色。</div>";
          F.setStatus("库存调整 · 无权限");
          return;
        }
        box.innerHTML = '<div class="form-grid" style="max-width:760px">' +
          '<label>物料</label><select id="aMat">' + opts + "</select>" +
          '<label>仓库</label><select id="aWh">' + whOptions("", false) + "</select>" +
          '<label>调整类型</label><select id="aType">' +
          ["盘盈", "盘亏", "领用出库", "其他入库"].map(function (t) {
            return "<option>" + t + "</option>";
          }).join("") + "</select>" +
          '<label>批次</label><input id="aBatch" type="text" placeholder="留空自动生成">' +
          '<label>数量</label><input id="aQty" type="number" value="1">' +
          '<label>原因</label><input id="aReason" type="text" placeholder="如：线边仓退料 / 试制领用">' +
          "</div>" +
          '<div style="margin-top:12px"><button class="btn primary" id="aSave">提交调整</button>' +
          '<span class="small muted" style="margin-left:10px">' +
          "盘亏 / 领用出库会校验库存充足；每次调整都会写一条流水并推送 stock.adjusted 事件。</span></div>";
        document.getElementById("aSave").addEventListener("click", function () {
          F.api("POST", "/api/stock/adjust", {
            materialCode: document.getElementById("aMat").value,
            warehouse: document.getElementById("aWh").value,
            type: document.getElementById("aType").value,
            batch: document.getElementById("aBatch").value.trim(),
            qty: Number(document.getElementById("aQty").value || 0),
            reason: document.getElementById("aReason").value.trim()
          }).then(function (r) {
            F.toast("库存已调整：" + r.type + " " + r.materialCode + " " + F.qty(r.qty), "ok");
            draw();
          }).catch(function (e) { F.showErr(e); });
        });
        F.setStatus("库存调整 · 手工过账入口");
        F.setSide('<div class="side-block"><div class="hd">可用类型</div><div class="bd small muted" ' +
          'style="line-height:1.9">盘盈 / 其他入库 → 增加库存；盘亏 / 领用出库 → 减少库存。<br>' +
          "采购入库请走收货质检页面的「入库过账」，仓间移库请用调拨单，避免口径混乱。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    draw();
  });
})(window, document);

</script>
<script>
/* 飞泉 SCM · 结算付款（三单匹配 / 付款 / 应付账龄）与报表分析 */
(function (window, document) {
  "use strict";
  var F = window.F;

  function me() { return (F.state.boot && F.state.boot.user) || {}; }
  function canFinance() {
    var r = me().role;
    return r === "admin" || r === "finance" || r === "purchase_director";
  }

  /* ============================================================ 结算付款 */
  F.register("invoices", function () {
    var st = { status: "全部", kw: "" };

    function draw() {
      Promise.all([
        F.api("GET", "/api/invoices?" + F.qs({ status: st.status, kw: st.kw })),
        F.api("GET", "/api/payables")
      ]).then(function (res) {
        var d = res[0], pay = res[1];
        var counts = { "全部": d.total };
        d.list.forEach(function (r) { counts[r.status] = (counts[r.status] || 0) + 1; });
        var paid = d.list.reduce(function (a, r) { return a + Number(r.paidAmount || 0); }, 0);
        var diffCnt = d.list.filter(function (r) { return r.matchResult === "金额差异超限"; }).length;

        var kpi = '<div class="kpi-grid four">' +
          '<div class="kpi gold"><div class="k-label">待付 / 应付余额</div><div class="k-value">' +
          F.wan(pay.due) + '</div><div class="k-sub">' + pay.total + " 张未结清发票</div></div>" +
          '<div class="kpi red"><div class="k-label">逾期应付</div><div class="k-value">' +
          F.wan(pay.overdue) + "</div><div class='k-sub'>账龄口径按到期日+30 天</div></div>" +
          '<div class="kpi"><div class="k-label">差异挂起</div><div class="k-value">' + diffCnt +
          '</div><div class="k-sub">容差 ' + F.pct(d.tolerance, 1) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">已付款金额</div><div class="k-value">' +
          F.wan(paid) + '</div><div class="k-sub">发票共 ' + d.total + " 张</div></div></div>";

        var chips = ["全部", "待匹配", "待付款", "已付款", "差异挂起"].map(function (s) {
          return '<button class="chip ' + (st.status === s ? "on" : "") + '" data-st="' + s + '">' + s +
            "<b>" + (counts[s] || 0) + "</b></button>";
        }).join("");

        var html = kpi + '<div class="panel"><div class="panel-title">发票与三单匹配' +
          '<span class="panel-actions">' +
          '<input id="iKw" type="text" placeholder="发票号 / 订单号 / 供应商" value="' + F.esc(st.kw) +
          '" style="width:200px"><button class="btn sm" id="iSearch">查询</button>' +
          (canFinance() ? '<button class="btn sm primary" id="iNew">+ 登记发票</button>' : "") +
          "</span></div>" +
          '<div class="panel-body"><div class="chips">' + chips + "</div></div>" +
          '<div class="panel-body flush">' + F.table([
            { label: "发票号", render: function (r) {
              return '<span class="mono small">' + F.esc(r.no) + '</span><div class="muted small">' +
                F.esc(r.invoiceNo || "—") + "</div>";
            } },
            { label: "采购订单", render: function (r) { return '<span class="mono small">' +
              F.esc(r.poNo) + "</span>"; } },
            { label: "供应商", render: function (r) { return F.esc(r.supplierName); } },
            { label: "发票金额", num: true, render: function (r) { return F.money(r.amount); } },
            { label: "已付", num: true, render: function (r) {
              return r.paidAmount ? F.money(r.paidAmount) : '<span class="muted">0.00</span>';
            } },
            { label: "差异", num: true, render: function (r) {
              var v = Number(r.diffAmount || 0);
              return (v ? '<b class="' + (v > 0 ? "up" : "down") + '">' + F.money(v) + "</b>"
                : '<span class="muted">0.00</span>') + '<div class="muted small">' + F.pct(r.diffRate, 2) +
                "</div>";
            } },
            { label: "匹配结果", render: function (r) { return F.tag(r.matchResult || "未匹配"); } },
            { label: "到期日", render: function (r) {
              return F.esc(r.dueDate || "—") + (r.overdueDays > 0
                ? '<div class="small up">逾期 ' + r.overdueDays + " 天</div>" : "");
            } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "操作", render: function (r) {
              if (!canFinance()) return "—";
              var b = ['<button class="btn xs" data-view="' + F.esc(r.no) + '">三单对照</button>'];
              if (r.matchResult !== "通过") b.push('<button class="btn xs" data-match="' +
                F.esc(r.no) + '">重新匹配</button>');
              if (r.matchResult === "通过" && r.status !== "已付款") b.push(
                '<button class="btn xs primary" data-pay="' + F.esc(r.no) + '">付款</button>');
              return b.join(" ");
            } }
          ], d.list, { click: function (r) { return r.no; }, empty: "暂无发票" }) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">应付账龄分析' +
          '<span class="panel-actions small muted">到期日 ' + pay.total + " 张 / 余额 " +
          F.money(pay.due) + "</span></div>" +
          '<div class="panel-body">' + F.barChart(pay.buckets.map(function (b, i) {
            return { label: b.bucket, label2: F.wan(b.amount), value: b.amount,
              color: ["#6aa9a0", "#2b9eb3", "#c8963e", "#d98a5f", "#c0504d"][i % 5] };
          }), { height: 170 }) + "</div>" +
          '<div class="panel-body flush">' + F.table([
            { label: "发票号", render: function (r) { return '<span class="mono small">' +
              F.esc(r.no) + "</span>"; } },
            { label: "供应商", key: "supplierName" },
            { label: "未付金额", num: true, render: function (r) {
              return F.money(Number(r.amount) - Number(r.paidAmount));
            } },
            { label: "到期日", key: "dueDate" },
            { label: "逾期天数", num: true, render: function (r) {
              return r.overdueDays > 0 ? '<b class="up">' + r.overdueDays + "</b>" : "—";
            } },
            { label: "账龄", render: function (r) { return F.tag(r.payState); } }
          ], pay.list, { empty: "没有未结清发票" }) + "</div></div>";

        document.getElementById("view").innerHTML = html;

        document.getElementById("iSearch").addEventListener("click", function () {
          st.kw = document.getElementById("iKw").value.trim(); draw();
        });
        document.getElementById("iKw").addEventListener("keydown", function (e) {
          if (e.key === "Enter") document.getElementById("iSearch").click();
        });
        document.querySelectorAll("[data-st]").forEach(function (b) {
          b.addEventListener("click", function () { st.status = b.getAttribute("data-st"); draw(); });
        });
        var nb = document.getElementById("iNew");
        if (nb) nb.addEventListener("click", newInvoice);
        F.bindRows(document, function (no) { triple(no, d.list); });
        document.querySelectorAll("[data-view]").forEach(function (b) {
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            triple(b.getAttribute("data-view"), d.list);
          });
        });
        document.querySelectorAll("[data-match]").forEach(function (b) {
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            F.api("POST", "/api/invoices/" + encodeURIComponent(b.getAttribute("data-match")) + "/match", {})
              .then(function (r) {
                F.toast("三单匹配：" + r.match.result + "（差异 " + F.money(r.match.diff) + "）",
                  r.match.result === "通过" ? "ok" : "err");
                draw();
              }).catch(function (e) { F.showErr(e); });
          });
        });
        document.querySelectorAll("[data-pay]").forEach(function (b) {
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            payDialog(b.getAttribute("data-pay"), d.list);
          });
        });
        F.setStatus("结算付款 · " + d.total + " 张发票 / 待付 " + F.money(pay.due));
      }).catch(function (e) { F.showErr(e); });
    }

    function triple(no, list) {
      var r = list.filter(function (x) { return x.no === no; })[0];
      if (!r) return;
      var tol = 0.02;
      var inTol = Math.abs(Number(r.diffRate || 0)) <= tol;
      var body = '<div class="detail-head"><div class="dh-title">' + F.esc(r.no) + " · " +
        F.esc(r.supplierName) + '</div><div class="dh-tags">' + F.tag(r.matchResult || "未匹配") +
        F.tag(r.status) + "</div></div>" +
        '<div class="kpi-grid three" style="margin-bottom:10px">' +
        '<div class="kpi"><div class="k-label">订单金额</div><div class="k-value">' +
        F.money(r.poAmount) + '</div><div class="k-sub">' + F.esc(r.poNo) + "</div></div>" +
        '<div class="kpi"><div class="k-label">收货金额</div><div class="k-value">' +
        F.money(r.receivedAmount) + '</div><div class="k-sub">质检合格入库口径</div></div>' +
        '<div class="kpi ' + (inTol ? "green" : "red") + '"><div class="k-label">发票金额</div>' +
        '<div class="k-value">' + F.money(r.amount) + '</div><div class="k-sub">差异率 ' +
        F.pct(r.diffRate, 2) + " / 容差 " + F.pct(tol, 1) + "</div></div></div>" +
        F.table([
          { label: "项目", key: "k" },
          { label: "数值", num: true, render: function (x) { return x.v; } }
        ], [
          { k: "发票号码", v: F.esc(r.invoiceNo || "—") },
          { k: "开票日期", v: F.esc(r.invoiceDate || "—") },
          { k: "税率", v: F.pct(r.taxRate, 0) },
          { k: "差异金额", v: F.money(r.diffAmount) },
          { k: "匹配判定", v: F.tag(r.matchResult || "未匹配") },
          { k: "到期日", v: F.esc(r.dueDate || "—") },
          { k: "已付金额", v: F.money(r.paidAmount) },
          { k: "付款状态", v: F.tag(r.payState) }
        ]) +
        '<div class="note" style="margin-top:10px">匹配口径：|发票额 − 收货额| ÷ 收货额 ≤ 容差即通过；' +
        "无收货或无发票时分别返回「无收货」「无发票」，需先补收货或补登记发票。</div>";
      F.dialog("三单对照 · " + no, body, '<button class="btn" data-close2="1">关闭</button>');
      document.getElementById("dialog").querySelector("[data-close2]")
        .addEventListener("click", F.closeDialog);
    }

    function newInvoice() {
      F.api("GET", "/api/orders?status=全部").then(function (od) {
        var pool = od.list.filter(function (o) {
          return ["已下单", "部分到货", "全部到货"].indexOf(o.status) >= 0;
        });
        if (!pool.length) { F.toast("没有可登记发票的订单（需已下单 / 到货中）", "err"); return; }
        var opts = pool.map(function (o) {
          return '<option value="' + F.esc(o.no) + '" data-amt="' + o.receivedAmount + '" data-po="' +
            o.amount + '">' + F.esc(o.no + " · " + o.supplierName + " · 订单 " + F.money(o.amount) +
            " / 收货 " + F.money(o.receivedAmount)) + "</option>";
        }).join("");
        F.dialog("登记发票", '<div class="form-grid">' +
          '<label>采购订单</label><select id="vPo" style="grid-column:span 3">' + opts + "</select>" +
          '<label>发票号码</label><input id="vNo" type="text" placeholder="如 03210045">' +
          '<label>开票日期</label><input id="vDate" type="date" value="' + F.today() + '">' +
          '<label>发票金额</label><input id="vAmt" type="number" step="0.01">' +
          '<label>税率</label><input id="vTax" type="number" step="0.01" value="0.13">' +
          '<label>账期（天）</label><input id="vTerms" type="number" value="30">' +
          '<label>备注</label><input id="vRemark" type="text"></div>' +
          '<div class="small muted" style="margin-top:8px">登记时自动做三单匹配：发票金额与收货金额差异在容差内' +
          "则进入「待付款」，否则「差异挂起」。</div>",
          '<button class="btn" data-close2="1">取消</button>' +
          '<button class="btn primary" id="vSave">登记并匹配</button>');
        var dlg = document.getElementById("dialog");
        dlg.querySelector("[data-close2]").addEventListener("click", F.closeDialog);
        var sel = document.getElementById("vPo");
        function fill() {
          var o = sel.options[sel.selectedIndex];
          if (!o) return;
          var recv = Number(o.getAttribute("data-amt") || 0);
          var po = Number(o.getAttribute("data-po") || 0);
          document.getElementById("vAmt").value = (recv || po).toFixed(2);
        }
        sel.addEventListener("change", fill);
        fill();
        document.getElementById("vSave").addEventListener("click", function () {
          F.api("POST", "/api/invoices", {
            poNo: sel.value,
            invoiceNo: document.getElementById("vNo").value.trim(),
            invoiceDate: document.getElementById("vDate").value,
            amount: Number(document.getElementById("vAmt").value || 0),
            taxRate: Number(document.getElementById("vTax").value || 0.13),
            termsDays: Number(document.getElementById("vTerms").value || 30),
            remark: document.getElementById("vRemark").value.trim()
          }).then(function (r) {
            F.closeDialog();
            F.toast("发票已登记：" + r.no + " · 匹配 " + r.matchResult, r.matchResult === "通过" ? "ok" : "err");
            draw();
          }).catch(function (e) { F.showErr(e); });
        });
      });
    }

    function payDialog(no, list) {
      var r = list.filter(function (x) { return x.no === no; })[0];
      if (!r) return;
      var left = Number(r.amount) - Number(r.paidAmount);
      F.dialog("付款 · " + no, '<div class="form-grid">' +
        '<label>供应商</label><div>' + F.esc(r.supplierName) + "</div>" +
        '<label>发票金额</label><div>' + F.money(r.amount) + "</div>" +
        '<label>已付金额</label><div>' + F.money(r.paidAmount) + "</div>" +
        '<label>本次付款</label><input id="pAmt" type="number" step="0.01" value="' + left.toFixed(2) + '">' +
        "</div>" + '<div class="note" style="margin-top:10px">付款后如付满发票金额，发票状态置为「已付款」；' +
        "订单结算需财务在三单匹配通过后推进到「已结算」。</div>",
        '<button class="btn" data-close2="1">取消</button>' +
        '<button class="btn primary" id="pSave">确认付款</button>');
      document.getElementById("dialog").querySelector("[data-close2]")
        .addEventListener("click", F.closeDialog);
      document.getElementById("pSave").addEventListener("click", function () {
        F.api("POST", "/api/invoices/" + encodeURIComponent(no) + "/pay",
          { amount: Number(document.getElementById("pAmt").value || 0) }).then(function (res) {
          F.closeDialog();
          F.toast("付款已登记：" + F.money(res.paidAmount) + "（" + res.status + "）", "ok");
          draw();
        }).catch(function (e) { F.showErr(e); });
      });
    }

    draw();
  });

  /* ============================================================ 报表分析 */
  F.register("reports", function () {
    F.api("GET", "/api/reports").then(function (d) {
      var k = d.kpi;
      var html = '<div class="kpi-grid six">' +
        '<div class="kpi"><div class="k-label">采购订单</div><div class="k-value">' + k.poCount +
        '</div><div class="k-sub">金额 ' + F.wan(k.poAmount) + "</div></div>" +
        '<div class="kpi green"><div class="k-label">单均采购额</div><div class="k-value">' +
        F.wan(k.avgPoAmount) + '</div><div class="k-sub">不含已取消</div></div>' +
        '<div class="kpi"><div class="k-label">供应商</div><div class="k-value">' + k.supplierCount +
        '</div><div class="k-sub">已准入 ' + k.activeSupplier + "</div></div>" +
        '<div class="kpi"><div class="k-label">库存金额</div><div class="k-value">' +
        F.wan(k.stockAmount) + '</div><div class="k-sub">近 90 天领用 ' + F.wan(k.issueAmount) + "</div></div>" +
        '<div class="kpi red"><div class="k-label">缺料项</div><div class="k-value">' + k.shortageCount +
        '</div><div class="k-sub">含待补货</div></div>' +
        '<div class="kpi gold"><div class="k-label">应付 / 逾期</div><div class="k-value">' +
        F.wan(k.payable) + '</div><div class="k-sub">逾期 ' + F.wan(k.overduePayable) + "</div></div></div>";

      html += '<div class="panel"><div class="panel-title">采购金额趋势（近 6 个月）' +
        '<span class="panel-actions small muted">含未结算、不含已取消</span></div>' +
        '<div class="panel-body">' + F.lineChart([
          { name: "amount", data: d.purchaseTrend.map(function (t) { return t.amount; }) }
        ], { labels: d.purchaseTrend.map(function (t) { return t.month.slice(5) + "月"; }), height: 200 }) +
        "</div></div>";

      html += '<div class="panel"><div class="panel-title">采购金额 · 物料类别</div><div class="panel-body">' +
        F.barChart((d.byCategory || []).map(function (c, i) {
          return { label: c.category, label2: F.wan(c.amount), value: c.amount,
            color: ["#1f7a8c", "#2b9eb3", "#6aa9a0", "#c8963e", "#7a5ea8"][i % 5] };
        }), { height: 170 }) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">供应商绩效 TOP 10' +
        '<span class="panel-actions small muted">交付 35 / 质量 35 / 价格 15 / 协同 15</span></div>' +
        '<div class="panel-body flush">' + F.table([
          { label: "供应商", render: function (r) { return F.esc(r.name) +
            '<div class="muted small mono">' + F.esc(r.code) + "</div>"; } },
          { label: "等级", render: function (r) { return F.levelTag(r.level); } },
          { label: "综合分", num: true, render: function (r) { return F.scoreBadge(r.score); } },
          { label: "交付及时率", num: true, render: function (r) { return F.pct(r.deliveryRate, 1); } },
          { label: "质量合格率", num: true, render: function (r) { return F.pct(r.qualityRate, 1); } },
          { label: "价格指数", num: true, render: function (r) {
            var v = Number(r.priceIndex || 1);
            return '<span class="' + (v > 1.02 ? "up" : v < 0.98 ? "down" : "") + '">' + v.toFixed(3) + "</span>";
          } },
          { label: "近 90 天准时率", num: true, render: function (r) { return F.pct(r.onTimeRate, 0); } },
          { label: "采购额", num: true, render: function (r) { return F.money(r.poAmount); } },
          { label: "订单数", num: true, render: function (r) { return r.poCount; } },
          { label: "状态", render: function (r) { return F.tag(r.status); } }
        ], d.suppliers || [], { empty: "暂无供应商绩效" }) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">库存周转（近 90 天）</div><div class="panel-body flush">' +
        F.table([
          { label: "物料类别", key: "category" },
          { label: "出库金额", num: true, render: function (r) { return F.money(r.issueAmount); } },
          { label: "库存金额", num: true, render: function (r) { return F.money(r.stockAmount); } },
          { label: "周转次数", num: true, render: function (r) {
            return '<b>' + Number(r.times || 0).toFixed(2) + "</b>";
          } },
          { label: "周转天数", num: true, render: function (r) {
            return r.days === null ? "—" : F.qty(r.days) + " 天";
          } }
        ], d.turnover || [], { empty: "暂无周转数据" }) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">到货准时率（按月）</div><div class="panel-body">' +
        F.lineChart([{ name: "rate", data: d.onTime.map(function (t) { return Number(t.rate || 0) * 100; }) }],
          { labels: d.onTime.map(function (t) { return t.month.slice(5) + "月"; }), height: 160 }) +
        '<div class="small muted">口径：收货日期 ≤ 订单承诺日期视为准时；当月无收货时按 0 处理。</div></div></div>';

      html += '<div class="panel"><div class="panel-title">重点物料价格波动' +
        '<span class="panel-actions small muted">价格指数 = 最新成交价 ÷ 标准价</span></div>' +
        '<div class="panel-body flush">' + F.table([
          { label: "物料", render: function (r) { return F.esc(r.name) +
            '<div class="muted small mono">' + F.esc(r.code) + "</div>"; } },
          { label: "标准价", num: true, render: function (r) { return F.money(r.standard); } },
          { label: "最新成交价", num: true, render: function (r) { return F.money(r.latest); } },
          { label: "价格指数", num: true, render: function (r) {
            var v = Number(r.index || 1);
            return '<b class="' + (v > 1 ? "up" : "down") + '">' + v.toFixed(3) + "</b>";
          } },
          { label: "节约率", num: true, render: function (r) {
            return F.pct(r.saving, 2);
          } },
          { label: "最近成交", render: function (r) {
            return (r.history || []).slice(0, 3).map(function (h) {
              return '<span class="small muted">' + F.esc(h.at) + " · " + F.money(h.price) + "</span>";
            }).join("<br>");
          } }
        ], d.price || [], { empty: "暂无价格记录" }) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">缺料清单</div><div class="panel-body flush">' +
        F.table([
          { label: "物料", render: function (r) { return F.esc(r.name) +
            '<div class="muted small mono">' + F.esc(r.code) + "</div>"; } },
          { label: "现存量", num: true, render: function (r) { return F.qty(r.onHand) + " " + F.esc(r.unit); } },
          { label: "安全库存", num: true, render: function (r) { return F.qty(r.safetyStock); } },
          { label: "建议补货", num: true, render: function (r) {
            return '<b class="up">' + F.qty(r.suggestQty) + "</b>";
          } },
          { label: "预计金额", num: true, render: function (r) { return F.money(r.estAmount); } },
          { label: "状态", render: function (r) { return F.tag(r.state); } }
        ], d.shortages || [], { empty: "没有缺料" }) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">应付账龄' +
        '<span class="panel-actions small muted">余额 ' + F.money(d.payables.due) + " / 逾期 " +
        F.money(d.payables.overdue) + "</span></div><div class='panel-body flush'>" +
        F.table([
          { label: "发票号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
          { label: "供应商", key: "supplierName" },
          { label: "未付金额", num: true, render: function (r) {
            return F.money(Number(r.amount) - Number(r.paidAmount));
          } },
          { label: "到期日", key: "dueDate" },
          { label: "逾期", num: true, render: function (r) {
            return r.overdueDays > 0 ? '<b class="up">' + r.overdueDays + " 天</b>" : "—";
          } }
        ], d.payables.list || [], { empty: "没有未结清发票" }) + "</div></div>";

      document.getElementById("view").innerHTML = html;
      F.setStatus("报表分析 · 9 个模块 · 三单匹配容差 " + F.pct(d.tolerance, 1));
      F.setSide('<div class="side-block"><div class="hd">口径说明</div><div class="bd small muted" ' +
        'style="line-height:1.9">采购趋势按订单下单月份归集；周转次数 = 近 90 天出库金额 ÷ 期末库存金额，' +
        "周转天数按月折算；准时率按收货日期与承诺日期比对；应付账龄按到期日之后的天数分档。</div></div>" +
        '<div class="side-block"><div class="hd">报表用途</div><div class="bd small muted" style="line-height:1.9">' +
        "采购额与类别结构用于预算复盘；供应商绩效用于年度评审与配额调整；缺料与效期用于补货排程；" +
        "价格波动用于议价与标准价维护。</div></div>");
    }).catch(function (e) { F.showErr(e); });
  });
})(window, document);

</script>
<script>
/* 飞泉 SCM · 集成中心（API Key / Webhook / 投递记录 / 外部映射 / 增量变更流） */
(function (window, document) {
  "use strict";
  var F = window.F;

  function isAdmin() {
    var u = (F.state.boot && F.state.boot.user) || {};
    return u.role === "admin";
  }

  var EVENTS = [
    "supplier.created", "supplier.status_changed", "supplier.scored",
    "material.created", "req.created", "req.submitted", "req.approved", "req.rejected",
    "rfq.created", "rfq.awarded", "po.created", "po.stage_changed", "po.cancelled",
    "receipt.created", "receipt.inspected", "receipt.posted", "receipt.returned",
    "stock.adjusted", "stock.transferred", "stock.stocktake",
    "invoice.created", "invoice.matched", "invoice.paid"
  ];

  var OBJECTS = ["supplier", "material", "requisition", "rfq", "po", "receipt", "stock",
    "transfer", "stocktake", "invoice"];

  F.register("integration", function () {
    if (!isAdmin()) {
      document.getElementById("view").innerHTML =
        '<div class="panel"><div class="panel-title">集成中心</div><div class="panel-body">' +
        '<div class="warn-box">集成中心仅管理员可见：API Key 与 Webhook 属于系统级凭证，' +
        "当前账号（" + F.esc(((F.state.boot || {}).user || {}).role_label || "非管理员") +
        "）没有访问权限。如需对接 ERP / WMS / 财务系统，请联系系统管理员开通。</div>" +
        '<div class="note" style="margin-top:10px">对接方仍可通过管理员分配的 API Key 调用开放接口，' +
        "接口文档见《飞泉 SCM 系统设计方案》第 9 章与 docs/API.md。</div></div></div>";
      F.setStatus("集成中心 · 需要管理员权限");
      F.setSide('<div class="side-block"><div class="hd">已开放的对接方式</div><div class="bd small muted" ' +
        'style="line-height:1.9">① REST + API Key（Header: X-Fq-Key）<br>' +
        "② Webhook 事件推送（HMAC-SHA256 签名）<br>" +
        "③ 增量同步 /api/sync/changes?since=&object=</div></div>");
      return;
    }

    var st = { tab: "keys" };

    function draw() {
      F.api("GET", "/api/integration/overview").then(function (ov) {
        var tabs = [["keys", "API Key"], ["hooks", "Webhook"], ["deliveries", "投递记录"],
          ["mappings", "外部映射"], ["changes", "变更流"]].map(function (t) {
          return '<button class="' + (st.tab === t[0] ? "on" : "") + '" data-tab="' + t[0] + '">' +
            t[1] + "</button>";
        }).join("");

        var html = '<div class="kpi-grid four">' +
          '<div class="kpi"><div class="k-label">启用中的 API Key</div><div class="k-value">' + ov.keys +
          '</div><div class="k-sub">scope 分 read / write</div></div>' +
          '<div class="kpi green"><div class="k-label">启用中的 Webhook</div><div class="k-value">' +
          ov.webhooks + '</div><div class="k-sub">待投递 ' + ov.pending + " 条</div></div>" +
          '<div class="kpi red"><div class="k-label">投递失败</div><div class="k-value">' + ov.failed +
          '</div><div class="k-sub">共 ' + ov.deliveries + " 条投递记录</div></div>" +
          '<div class="kpi gold"><div class="k-label">增量变更</div><div class="k-value">' + ov.changes +
          '</div><div class="k-sub">最近 ' + F.esc((ov.lastChange || "—").slice(5, 16)) + "</div></div></div>" +
          '<div class="panel"><div class="panel-title">集成中心' +
          '<span class="panel-actions small muted">凭证仅管理员可见 · 明文 Key 只展示一次</span></div>' +
          '<div class="panel-body" style="padding-bottom:0"><div class="tabs">' + tabs + "</div></div>" +
          '<div class="panel-body" id="intgBody">加载中…</div></div>';
        document.getElementById("view").innerHTML = html;
        document.querySelectorAll("[data-tab]").forEach(function (b) {
          b.addEventListener("click", function () { st.tab = b.getAttribute("data-tab"); draw(); });
        });
        if (st.tab === "keys") return drawKeys();
        if (st.tab === "hooks") return drawHooks();
        if (st.tab === "deliveries") return drawDeliveries();
        if (st.tab === "mappings") return drawMappings();
        return drawChanges();
      }).catch(function (e) { F.showErr(e); });
    }

    function drawKeys() {
      F.api("GET", "/api/integration/keys").then(function (d) {
        var box = document.getElementById("intgBody");
        box.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;' +
          'margin-bottom:8px"><div class="small muted">共 ' + d.total + " 个 Key</div>" +
          '<button class="btn sm primary" id="kNew">+ 新建 API Key</button></div>' +
          '<div style="margin:0 -14px -14px">' + F.table([
            { label: "名称", key: "name" },
            { label: "前缀", render: function (r) { return '<span class="mono small">' +
              F.esc(r.keyPrefix) + "…</span>"; } },
            { label: "权限", render: function (r) { return F.tag(r.scope, r.scope === "write" ? "gold" : "blue"); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "创建人", key: "owner" },
            { label: "创建时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.createdAt) + "</span>"; } },
            { label: "最近使用", render: function (r) { return r.lastUsedAt
              ? '<span class="small muted">' + F.esc(r.lastUsedAt) + "</span>"
              : '<span class="muted">未使用</span>'; } },
            { label: "有效期", render: function (r) { return r.expiresAt
              ? F.esc(r.expiresAt) : '<span class="muted">长期</span>'; } },
            { label: "操作", render: function (r) {
              return r.status === "启用"
                ? '<button class="btn xs danger" data-revoke="' + r.id + '">吊销</button>'
                : '<span class="muted">—</span>';
            } }
          ], d.list, { empty: "还没有 API Key" }) + "</div>";
        document.getElementById("kNew").addEventListener("click", function () {
          F.dialog("新建 API Key", '<div class="form-grid">' +
            '<label>名称</label><input id="kName" type="text" placeholder="如：金蝶云星空对接">' +
            '<label>权限</label><select id="kScope"><option value="read">read（只读）</option>' +
            '<option value="write">write（读写）</option></select></div>' +
            '<div class="note" style="margin-top:10px">Key 形如 <span class="mono">fqk_…</span>，' +
            "服务端只保存 SHA-256 哈希；调用时放在请求头 <span class='mono'>X-Fq-Key</span>。</div>",
            '<button class="btn" data-close2="1">取消</button>' +
            '<button class="btn primary" id="kSave">生成 Key</button>');
          document.getElementById("dialog").querySelector("[data-close2]")
            .addEventListener("click", F.closeDialog);
          document.getElementById("kSave").addEventListener("click", function () {
            F.api("POST", "/api/integration/keys", {
              name: document.getElementById("kName").value.trim(),
              scope: document.getElementById("kScope").value
            }).then(function (r) {
              F.dialog("Key 已生成 · 请立即保存", '<div class="keybox mono">' + F.esc(r.key) + "</div>" +
                '<div class="note" style="margin-top:10px">' + F.esc(r.notice) + "</div>" +
                '<div class="small muted" style="margin-top:8px">调用示例：<br>' +
                '<span class="mono">curl -H "X-Fq-Key: ' + F.esc(r.key) + '" ' +
                'http://127.0.0.1:8019/api/orders</span></div>',
                '<button class="btn primary" data-close2="1">我已保存</button>');
              document.getElementById("dialog").querySelector("[data-close2]")
                .addEventListener("click", function () { F.closeDialog(); draw(); });
            }).catch(function (e) { F.showErr(e); });
          });
        });
        document.querySelectorAll("[data-revoke]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (!window.confirm("吊销后该 Key 立即失效，确认吊销？")) return;
            F.api("DELETE", "/api/integration/keys/" + b.getAttribute("data-revoke"))
              .then(function () { F.toast("Key 已吊销", "ok"); draw(); })
              .catch(function (e) { F.showErr(e); });
          });
        });
        F.setStatus("集成中心 · API Key " + d.total + " 个");
        F.setSide('<div class="side-block"><div class="hd">鉴权方式</div><div class="bd small muted" ' +
          'style="line-height:1.9">请求头任选其一：<br><span class="mono">X-Fq-Key: fqk_…</span><br>' +
          '<span class="mono">Authorization: Bearer fqk_…</span><br>' +
          "write 权限的 Key 才能调用 POST / PUT / DELETE 接口。</div></div>" +
          '<div class="side-block"><div class="hd">建议</div><div class="bd small muted" style="line-height:1.9">' +
          "按对接方一人一键，便于单独吊销与审计；只读同步用 read，回写单据才给 write。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    function drawHooks() {
      F.api("GET", "/api/integration/webhooks").then(function (d) {
        var box = document.getElementById("intgBody");
        box.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;' +
          'margin-bottom:8px"><div class="small muted">共 ' + d.list.length + " 个订阅</div>" +
          '<button class="btn sm primary" id="wNew">+ 新建 Webhook</button></div>' +
          '<div style="margin:0 -14px -14px">' + F.table([
            { label: "名称", render: function (r) { return '<b>' + F.esc(r.name) + '</b><div class="muted small mono">' +
              F.esc(r.url) + "</div>"; } },
            { label: "事件", render: function (r) {
              var ev = String(r.events || "*");
              if (ev === "*") return F.tag("全部事件", "blue");
              var arr = ev.split(",");
              return arr.slice(0, 2).map(function (x) { return F.tag(x.trim(), "gray"); }).join(" ") +
                (arr.length > 2 ? '<span class="small muted"> +' + (arr.length - 2) + "</span>" : "");
            } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "投递统计", render: function (r) {
              var s = r.deliveryStats || {};
              var parts = Object.keys(s).map(function (k) { return k + " " + s[k]; });
              return parts.length ? '<span class="small">' + F.esc(parts.join(" / ")) + "</span>"
                : '<span class="muted">无记录</span>';
            } },
            { label: "最近投递", render: function (r) { return r.last_at
              ? '<span class="small muted">' + F.esc(r.last_at) + "</span>" +
                (r.last_status ? " " + F.tag(r.last_status, r.last_status === "成功" ? "green" : "red") : "")
              : '<span class="muted">—</span>'; } },
            { label: "操作", render: function (r) {
              return '<button class="btn xs" data-edit="' + r.id + '">编辑</button> ' +
                '<button class="btn xs" data-test="' + r.id + '">测试</button> ' +
                '<button class="btn xs danger" data-del="' + r.id + '">删除</button>';
            } }
          ], d.list, { empty: "还没有配置 Webhook" }) + "</div>";

        document.getElementById("wNew").addEventListener("click", function () { hookForm(null, d.list); });
        document.querySelectorAll("[data-edit]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-edit"));
            hookForm(d.list.filter(function (x) { return x.id === id; })[0], d.list);
          });
        });
        document.querySelectorAll("[data-test]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.api("POST", "/api/integration/webhooks/" + b.getAttribute("data-test") + "/test", {})
              .then(function () { F.toast("测试事件已入队，可在投递记录查看结果", "ok"); st.tab = "deliveries"; draw(); })
              .catch(function (e) { F.showErr(e); });
          });
        });
        document.querySelectorAll("[data-del]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (!window.confirm("删除该 Webhook 订阅？历史投递记录保留。")) return;
            F.api("DELETE", "/api/integration/webhooks/" + b.getAttribute("data-del"))
              .then(function () { F.toast("Webhook 已删除", "ok"); draw(); })
              .catch(function (e) { F.showErr(e); });
          });
        });
        F.setStatus("集成中心 · Webhook " + d.list.length + " 个");
        F.setSide('<div class="side-block"><div class="hd">签名校验</div><div class="bd small muted" ' +
          'style="line-height:1.9">收到回调后校验：<br>' +
          "签名原文 = <span class='mono'>timestamp + \".\" + body</span><br>" +
          "HMAC-SHA256(secret) 与 <span class='mono'>X-FQC-Signature</span> 比对；" +
          "时间戳偏移超过 5 分钟应拒绝，防止重放。</div></div>" +
          '<div class="side-block"><div class="hd">重试策略</div><div class="bd small muted" ' +
          'style="line-height:1.9">失败按 30 × 2ⁿ 秒退避重试，最多 3 次；最终失败保留记录，' +
          "可在投递记录页手动重投。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    function hookForm(h, list) {
      var picked = String((h && h.events) || "*") === "*" ? EVENTS.slice()
        : String(h.events).split(",").map(function (s) { return s.trim(); });
      var evHtml = EVENTS.map(function (e) {
        return '<label class="small" style="display:block;margin:2px 0"><input type="checkbox" class="ev"' +
          ' value="' + e + '"' + (picked.indexOf(e) >= 0 ? " checked" : "") + "> " + e + "</label>";
      }).join("");
      F.dialog(h ? "编辑 Webhook" : "新建 Webhook", '<div class="form-grid">' +
        '<label>名称</label><input id="wName" type="text" value="' + F.esc((h && h.name) || "") +
        '" placeholder="如：WMS 到货通知">' +
        '<label>地址</label><input id="wUrl" type="text" value="' + F.esc((h && h.url) || "") +
        '" placeholder="https://wms.example.com/hooks/fq">' +
        '<label>状态</label><select id="wStatus"><option>启用</option><option>停用</option></select>' +
        '<label>密钥</label><input id="wSecret" type="text" value="' + F.esc((h && h.secret) || "") +
        '" placeholder="留空自动生成 32 位"></div>' +
        '<div class="section-title" style="margin-top:10px">订阅事件（不选默认全部）</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px;max-height:200px;overflow:auto">' +
        evHtml + "</div>",
        '<button class="btn" data-close2="1">取消</button>' +
        '<button class="btn" id="wAll">全选</button>' +
        '<button class="btn primary" id="wSave">保存</button>');
      var dlg = document.getElementById("dialog");
      dlg.querySelector("[data-close2]").addEventListener("click", F.closeDialog);
      if (h) document.getElementById("wStatus").value = h.status || "启用";
      document.getElementById("wAll").addEventListener("click", function () {
        var all = document.querySelectorAll(".ev");
        var needCheck = Array.prototype.some.call(all, function (c) { return !c.checked; });
        Array.prototype.forEach.call(all, function (c) { c.checked = needCheck; });
      });
      document.getElementById("wSave").addEventListener("click", function () {
        var evs = [];
        document.querySelectorAll("#dialog .ev").forEach(function (c) {
          if (c.checked) evs.push(c.value);
        });
        var payload = {
          name: document.getElementById("wName").value.trim() || "未命名",
          url: document.getElementById("wUrl").value.trim(),
          events: evs.length ? evs : "*",
          status: document.getElementById("wStatus").value,
          secret: document.getElementById("wSecret").value.trim()
        };
        var req = h
          ? F.api("PUT", "/api/integration/webhooks/" + h.id, payload)
          : F.api("POST", "/api/integration/webhooks", payload);
        req.then(function () {
          F.closeDialog();
          F.toast("Webhook 已保存", "ok");
          draw();
        }).catch(function (e) { F.showErr(e); });
      });
    }

    function drawDeliveries() {
      F.api("GET", "/api/integration/deliveries").then(function (d) {
        var box = document.getElementById("intgBody");
        box.innerHTML = '<div class="small muted" style="margin-bottom:8px">最近 ' + d.total +
          " 条投递记录（最多 100 条）</div>" +
          '<div style="margin:0 -14px -14px">' + F.table([
            { label: "ID", render: function (r) { return '<span class="mono small">#' + r.id + "</span>"; } },
            { label: "事件", render: function (r) { return F.tag(r.event, "blue"); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "尝试", num: true, render: function (r) { return r.attempts + " 次"; } },
            { label: "HTTP", num: true, render: function (r) { return r.http_code || "—"; } },
            { label: "创建时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.created_at) + "</span>"; } },
            { label: "完成时间", render: function (r) { return r.delivered_at
              ? '<span class="small muted">' + F.esc(r.delivered_at) + "</span>" : '<span class="muted">—</span>'; } },
            { label: "错误", render: function (r) { return r.error
              ? '<span class="small down">' + F.esc(String(r.error).slice(0, 40)) + "</span>"
              : '<span class="muted">—</span>'; } },
            { label: "操作", render: function (r) {
              return '<button class="btn xs" data-pk="' + r.id + '">查看</button> ' +
                (r.status !== "成功" ? '<button class="btn xs primary" data-retry="' + r.id + '">重投</button>' : "");
            } }
          ], d.list, { empty: "暂无投递记录" }) + "</div>";
        document.querySelectorAll("[data-pk]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-pk"));
            var row = d.list.filter(function (x) { return x.id === id; })[0];
            F.dialog("投递详情 #" + id, '<div class="form-grid">' +
              '<label>事件</label><div class="mono small">' + F.esc(row.event) + "</div>" +
              '<label>状态</label><div>' + F.tag(row.status) + "</div>" +
              '<label>签名</label><div class="mono small" style="word-break:break-all">' +
              F.esc(row.signature || "—") + "</div>" +
              '<label>下次重试</label><div class="small muted">' + F.esc(row.next_at || "—") + "</div></div>" +
              '<div class="section-title" style="margin-top:10px">Payload</div>' +
              '<pre class="code" style="max-height:280px;overflow:auto">' +
              F.esc(JSON.stringify(row.payload, null, 2)) + "</pre>",
              '<button class="btn" data-close2="1">关闭</button>');
            document.getElementById("dialog").querySelector("[data-close2]")
              .addEventListener("click", F.closeDialog);
          });
        });
        document.querySelectorAll("[data-retry]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.api("POST", "/api/integration/deliveries/" + b.getAttribute("data-retry") + "/retry", {})
              .then(function () { F.toast("已重新入队", "ok"); draw(); })
              .catch(function (e) { F.showErr(e); });
          });
        });
        F.setStatus("投递记录 · " + d.total + " 条");
        F.setSide('<div class="side-block"><div class="hd">状态含义</div><div class="bd small muted" ' +
          'style="line-height:1.9">待投递：已入队等待投递线程；成功：2xx 响应；失败：重试次数用尽，' +
          "需排查接收端后手动重投。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    function drawMappings() {
      F.api("GET", "/api/integration/mappings").then(function (d) {
        var box = document.getElementById("intgBody");
        box.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;' +
          'margin-bottom:8px"><div class="small muted">共 ' + d.list.length + " 条外部 ID 映射</div>" +
          '<button class="btn sm primary" id="mNew">+ 绑定映射</button></div>' +
          '<div style="margin:0 -14px -14px">' + F.table([
            { label: "对象类型", render: function (r) { return F.tag(r.obj_type, "gray"); } },
            { label: "本系统单号", render: function (r) { return '<span class="mono small">' +
              F.esc(r.local_no) + "</span>"; } },
            { label: "外部 ID", render: function (r) { return '<span class="mono small">' +
              F.esc(r.external_id) + "</span>"; } },
            { label: "外部系统", key: "system" },
            { label: "创建时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.created_at) + "</span>"; } }
          ], d.list, { empty: "还没有映射关系" }) + "</div>";
        document.getElementById("mNew").addEventListener("click", function () {
          F.dialog("绑定外部 ID", '<div class="form-grid">' +
            '<label>对象类型</label><select id="mObj">' + OBJECTS.map(function (o) {
              return '<option value="' + o + '">' + o + "</option>";
            }).join("") + "</select>" +
            '<label>本系统单号</label><input id="mLocal" type="text" placeholder="如 PO20261020-0001">' +
            '<label>外部 ID</label><input id="mExt" type="text" placeholder="如 KD-PO-8891">' +
            '<label>外部系统</label><input id="mSys" type="text" placeholder="如 金蝶云星空"></div>' +
            '<div class="note" style="margin-top:10px">映射用于对接方按外部主键反查本系统单据：' +
            'GET /api/integration/resolve?externalId=…&system=…</div>',
            '<button class="btn" data-close2="1">取消</button>' +
            '<button class="btn primary" id="mSave">保存</button>');
          document.getElementById("dialog").querySelector("[data-close2]")
            .addEventListener("click", F.closeDialog);
          document.getElementById("mSave").addEventListener("click", function () {
            F.api("POST", "/api/integration/mappings", {
              objType: document.getElementById("mObj").value,
              localNo: document.getElementById("mLocal").value.trim(),
              externalId: document.getElementById("mExt").value.trim(),
              system: document.getElementById("mSys").value.trim()
            }).then(function (r) {
              F.closeDialog();
              F.toast(r.updated ? "映射已更新" : "映射已创建", "ok");
              draw();
            }).catch(function (e) { F.showErr(e); });
          });
        });
        F.setStatus("外部映射 · " + d.list.length + " 条");
        F.setSide('<div class="side-block"><div class="hd">映射口径</div><div class="bd small muted" ' +
          'style="line-height:1.9">同一外部系统 + 外部 ID 唯一；重复绑定会更新本系统单号。' +
          "建议对接方首次同步时先调用 resolve，命中则走更新，未命中再创建。</div></div>");
      }).catch(function (e) { F.showErr(e); });
    }

    function drawChanges() {
      var cursor = 0;
      function load(since) {
        F.api("GET", "/api/sync/changes?" + F.qs({ since: since || 0, limit: 50 })).then(function (d) {
          var box = document.getElementById("intgBody");
          if (!since) {
            box.innerHTML = '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">' +
              '<select id="cObj" style="width:150px"><option value="">全部对象</option>' +
              OBJECTS.map(function (o) { return '<option value="' + o + '">' + o + "</option>"; }).join("") +
              '</select><button class="btn sm" id="cPull">拉取最新 50 条</button>' +
              '<span class="small muted" id="cInfo"></span></div><div id="cList"></div>';
          }
          cursor = d.cursor;
          var html = '<div style="margin:0 -14px -14px">' + F.table([
            { label: "游标", render: function (r) { return '<span class="mono small">#' + r.id + "</span>"; } },
            { label: "对象", render: function (r) { return F.tag(r.obj_type, "gray"); } },
            { label: "单号", render: function (r) { return '<span class="mono small">' +
              F.esc(r.obj_no) + "</span>"; } },
            { label: "动作", render: function (r) { return F.tag(r.op, "blue"); } },
            { label: "操作人", key: "actor" },
            { label: "时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.changed_at) + "</span>"; } }
          ], d.changes, { empty: "没有变更" }) + "</div>";
          var list = document.getElementById("cList");
          if (list) list.innerHTML = html; else box.innerHTML += html;
          var info = document.getElementById("cInfo");
          if (info) info.textContent = "本次 " + d.count + " 条 · 游标 " + d.cursor +
            (d.hasMore ? " · 还有更多" : " · 已到末尾");
          if (!since) {
            document.getElementById("cPull").addEventListener("click", function () {
              var obj = document.getElementById("cObj").value;
              F.api("GET", "/api/sync/changes?" + F.qs({ since: 0, object: obj, limit: 50 }))
                .then(function (res) {
                  F.toast("拉取 " + res.count + " 条变更，游标 " + res.cursor, "ok");
                  draw();
                }).catch(function (e) { F.showErr(e); });
            });
          }
          F.setStatus("变更流 · 游标 " + d.cursor);
          F.setSide('<div class="side-block"><div class="hd">增量同步用法</div><div class="bd small muted" ' +
            'style="line-height:1.9">首次 since=0 拉全量，记录返回 cursor；下次带 since=cursor 继续拉取，' +
            "hasMore=true 时立即再拉一次。<br>建议按对象分topic消费，与本系统主键 obj_no 对齐。</div></div>" +
            '<div class="side-block"><div class="hd">对接顺序</div><div class="bd small muted" ' +
            'style="line-height:1.9">主数据（供应商 / 物料）→ 单据（请购 / 订单 / 收货 / 发票）→ 库存与结算。' +
            "回写建议只写对方系统，不在两侧同时改同一单。</div></div>");
        }).catch(function (e) { F.showErr(e); });
      }
      load(0);
    }

    draw();
  });
})(window, document);

</script>
</body>
</html>
